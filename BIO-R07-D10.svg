<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 500" width="800" height="500"><title id="title">Handwashing compliance observation</title><desc id="desc">Handwashing compliance observation. Before: 14, Week 1: 23, Week 2: 30, Week 4: 34. A time trend does not itself establish that the campaign caused the change.</desc><rect x="0" y="0" width="800" height="500" rx="18" fill="#ffffff"/><rect x="0" y="0" width="800" height="92" rx="18" fill="#18243b"/><text x="35" y="49" fill="#ffffff" font-size="25" font-family="Arial, sans-serif" font-weight="bold">Handwashing compliance observation</text><text x="35" y="79" fill="#d4deeb" font-size="14" font-family="Arial, sans-serif">Illustrative teaching dataset — not observational research</text><text x="32" y="152" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Before</text><rect x="215" y="128" width="177" height="38" rx="6" fill="#e2a42d"/><text x="412" y="155" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">14</text><text x="32" y="227" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Week 1</text><rect x="215" y="203" width="291" height="38" rx="6" fill="#e2a42d"/><text x="526" y="230" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">23</text><text x="32" y="302" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Week 2</text><rect x="215" y="278" width="379" height="38" rx="6" fill="#e2a42d"/><text x="614" y="305" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">30</text><text x="32" y="377" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Week 4</text><rect x="215" y="353" width="430" height="38" rx="6" fill="#e2a42d"/><text x="665" y="380" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">34</text><text x="32" y="460" fill="#1e293b" font-size="15" font-family="Arial, sans-serif">Measure: Compliant events (of 40)</text><text x="32" y="482" fill="#64748b" font-size="12" font-family="Arial, sans-serif">Read the values printed beside the bars; units are given in the measure label.</text></svg>