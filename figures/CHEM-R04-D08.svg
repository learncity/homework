<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 700 440" width="700" height="440" role="img" aria-label="Two structural isomers of C₂H₆O"><title>CHEM-R04-D08: Two structural isomers of C₂H₆O</title><desc>Visible diagram labels: Two structural isomers of C₂H₆O; Original Chemistry practice schematic — not to scale; A: CH₃–CH₂–OH; B: CH₃–O–CH₃; Ethanol; Dimethyl ether; Both have molecular formula C₂H₆O. These labels are not a verified scientific description; teacher review is required.</desc><rect width="700" height="440" fill="#ffffff" /><rect x="13" y="13" width="674" height="412" rx="14" fill="#f8fafc" stroke="#64748b" stroke-width="1.5" /><text x="32" y="46" font-size="24" font-family="Arial" font-weight="bold" fill="#102a43">Two structural isomers of C₂H₆O</text><text x="33" y="69" font-family="Arial" font-size="13" fill="#52657a">Original Chemistry practice schematic — not to scale</text><rect x="58" y="127" width="278" height="192" rx="4" fill="#ecfeff" stroke="#334155" stroke-width="2" /><rect x="365" y="127" width="278" height="192" rx="4" fill="#fef3c7" stroke="#334155" stroke-width="2" /><text x="93" y="181" font-family="Arial" font-size="25" font-weight="bold" fill="#172b4d">A: CH₃–CH₂–OH</text><text x="400" y="181" font-family="Arial" font-size="24" font-weight="bold" fill="#172b4d">B: CH₃–O–CH₃</text><text x="103" y="245" font-family="Arial" font-size="23" font-weight="normal" fill="#172b4d">Ethanol</text><text x="406" y="245" font-family="Arial" font-size="21" font-weight="normal" fill="#172b4d">Dimethyl ether</text><text x="145" y="359" font-family="Arial" font-size="18" font-weight="normal" fill="#172b4d">Both have molecular formula C₂H₆O</text></svg>