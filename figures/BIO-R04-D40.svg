<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title desc"><title id="title">Punnett square • single-gene cross</title><desc id="desc">Tt × tt, row gametes t and t, column gametes T and t, producing Tt, tt, Tt and tt.</desc><rect x="0" y="0" width="880" height="540" rx="0" fill="#F7FAFC" stroke="none"/><rect x="0" y="0" width="880" height="88" rx="0" fill="#1F2A44" stroke="none"/><text x="34" y="55" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="white">Punnett square • single-gene cross</text><text x="35" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">BIOLOGY • EVIDENCE PANEL D40</text><text x="42" y="169" text-anchor="start" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">Parents: Tt × tt    •    T is dominant over t</text><rect x="250" y="203" width="117" height="59" rx="4" fill="#1F2A44" stroke="none"/><text x="310.0" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white">Gamete</text><rect x="370" y="203" width="117" height="59" rx="4" fill="#1F2A44" stroke="none"/><text x="430.0" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white">T</text><rect x="490" y="203" width="117" height="59" rx="4" fill="#1F2A44" stroke="none"/><text x="550.0" y="242" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white">t</text><rect x="250" y="265" width="117" height="59" rx="4" fill="#1F2A44" stroke="none"/><text x="310.0" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white">t</text><rect x="370" y="265" width="117" height="59" rx="4" fill="#FBE3A5" stroke="none"/><text x="430.0" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#182941">Tt</text><rect x="490" y="265" width="117" height="59" rx="4" fill="#D5E9F6" stroke="none"/><text x="550.0" y="304" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#182941">tt</text><rect x="250" y="327" width="117" height="59" rx="4" fill="#1F2A44" stroke="none"/><text x="310.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="white">t</text><rect x="370" y="327" width="117" height="59" rx="4" fill="#FBE3A5" stroke="none"/><text x="430.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#182941">Tt</text><rect x="490" y="327" width="117" height="59" rx="4" fill="#D5E9F6" stroke="none"/><text x="550.0" y="366" text-anchor="middle" font-family="Arial, sans-serif" font-size="23" font-weight="bold" fill="#182941">tt</text><text x="47" y="456" text-anchor="start" font-family="Arial, sans-serif" font-size="19" font-weight="bold" fill="#182941">Expected genotypes: 2 Tt : 2 tt = 1 : 1</text><text x="47" y="501" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#64748B">Mendelian expectation assumes random segregation.</text></svg>