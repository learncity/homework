<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><title>CHEM-R06-D10: Iron corrosion comparison</title><desc>Visible diagram labels: Iron corrosion comparison; Two identical iron samples after the same exposure time; A: Dry air; B: Salt water; A: little visible rust; B: extensive rust. These labels are not a verified scientific description; teacher review is required.</desc><rect width="920" height="520" fill="#ffffff" /><rect width="920" height="86" fill="#17324d" /><text x="34" y="39" font-size="25" font-family="Arial" font-weight="700" fill="#ffffff">Iron corrosion comparison</text><text x="34" y="69" font-size="16" font-family="Arial" fill="#e3eff7">Two identical iron samples after the same exposure time</text><rect x="95" y="160" width="330" height="285" rx="8" fill="#eaf5fc" stroke="#475569" stroke-width="2" /><rect x="495" y="160" width="330" height="285" rx="8" fill="#eaf5fc" stroke="#475569" stroke-width="2" /><text x="155" y="195" font-size="22" font-family="Arial" fill="#17324d">A: Dry air</text><text x="565" y="195" font-size="22" font-family="Arial" fill="#17324d">B: Salt water</text><rect x="245" y="250" width="55" height="140" rx="8" fill="#a3a3a3" stroke="#475569" stroke-width="2" /><rect x="645" y="250" width="55" height="140" rx="8" fill="#a3a3a3" stroke="#475569" stroke-width="2" /><circle cx="690" cy="308" r="22" fill="#dc8151" stroke="#334155" stroke-width="2" /><circle cx="611" cy="338" r="16" fill="#dc8151" stroke="#334155" stroke-width="2" /><text x="116" y="468" font-size="20" font-family="Arial" fill="#17324d">A: little visible rust</text><text x="540" y="468" font-size="20" font-family="Arial" fill="#17324d">B: extensive rust</text></svg>