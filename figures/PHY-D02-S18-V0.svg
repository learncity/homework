<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Prism physics examination diagram">
<title>Prism physics examination diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Ray travelling from glass toward air</text>
<rect x="140" y="320" width="680" height="165" fill="#D6EAF9" stroke="#203A5E" stroke-width="3"/>
<line x1="475" y1="154" x2="475" y2="485" stroke="#203A5E" stroke-width="2"/>
<line x1="351" y1="457" x2="475" y2="320" stroke="#B64030" stroke-width="5" marker-end="url(#r)"/>
<line x1="475" y1="320" x2="599" y2="457" stroke="#B64030" stroke-width="4" marker-end="url(#r)"/>
<text x="365" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">i = 42°</text>
<text x="695" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">Critical angle = 40°</text>
<text x="730" y="381" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">Glass</text>
<text x="716" y="250" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">Air</text>
<text x="480" y="530" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203A5E" text-anchor="middle">Illustrative ray path; diagram not to scale</text>
</svg>