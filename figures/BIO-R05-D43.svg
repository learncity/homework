<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="t d"><title id="t">Pulse during recovery after exercise</title><desc id="d">Pulse per minute measured at 0, 1, 2 and 4 minutes after a brief activity. Data: 0 min 120 beats/min, 1 min 104 beats/min, 2 min 88 beats/min, 4 min 76 beats/min.</desc>
<rect width="920" height="610" fill="#FAFCFF"/>
<text x="40" y="62" font-size="30" font-family="Arial" font-weight="bold" fill="#172B4D">Pulse during recovery after exercise</text>
<text x="40" y="95" font-size="17" font-family="Arial" fill="#43536A">Pulse per minute measured at 0, 1, 2 and 4 minutes after a brief activity.</text>
<line x1="70" y1="455" x2="860" y2="455" stroke="#596D87" stroke-width="3"/>
<rect x="95" y="160.0" width="106" height="295.0" rx="5" fill="#276B9B"/>
<text x="148" y="152.0" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">120</text>
<text x="148" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">0 min</text>
<rect x="295" y="199.3" width="106" height="255.7" rx="5" fill="#276B9B"/>
<text x="348" y="191.3" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">104</text>
<text x="348" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">1 min</text>
<rect x="495" y="238.7" width="106" height="216.3" rx="5" fill="#276B9B"/>
<text x="548" y="230.7" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">88</text>
<text x="548" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">2 min</text>
<rect x="695" y="268.2" width="106" height="186.8" rx="5" fill="#276B9B"/>
<text x="748" y="260.2" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">76</text>
<text x="748" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">4 min</text>
<text x="40" y="553" font-size="17" font-family="Arial" fill="#172B4D">Unit: beats/min. Values are observations, not proof of cause.</text></svg>