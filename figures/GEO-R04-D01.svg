<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Five-month rainfall series</title><desc id="desc">June 90 mm; July 180 mm; August 240 mm; September 170 mm; October 70 mm. These are fictional one-year station totals.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Five-month rainfall series</text><line x1="68" y1="442" x2="900" y2="442" stroke="#15263d" stroke-width="2"/><rect x="89.0" y="337.0" width="75" height="105.0" rx="3" fill="#3683ba" stroke="#3683ba"/><text x="126.5" y="328.0" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">90 mm</text><text x="126.5" y="469" font-family="Arial" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">Jun</text><rect x="248.0" y="232.0" width="75" height="210.0" rx="3" fill="#3683ba" stroke="#3683ba"/><text x="285.5" y="223.0" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">180 mm</text><text x="285.5" y="469" font-family="Arial" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">Jul</text><rect x="407.0" y="162.0" width="75" height="280.0" rx="3" fill="#3683ba" stroke="#3683ba"/><text x="444.5" y="153.0" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">240 mm</text><text x="444.5" y="469" font-family="Arial" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">Aug</text><rect x="566.0" y="243.66666666666666" width="75" height="198.33333333333334" rx="3" fill="#3683ba" stroke="#3683ba"/><text x="603.5" y="234.66666666666666" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">170 mm</text><text x="603.5" y="469" font-family="Arial" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">Sep</text><rect x="725.0" y="360.33333333333337" width="75" height="81.66666666666666" rx="3" fill="#3683ba" stroke="#3683ba"/><text x="762.5" y="351.33333333333337" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">70 mm</text><text x="762.5" y="469" font-family="Arial" font-size="17" font-weight="600" fill="#1f2937" text-anchor="middle">Oct</text><text x="500" y="115" font-family="Arial" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Monthly rainfall at an imaginary station</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>