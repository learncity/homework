<text x="480" y="516" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#203A5E" text-anchor="middle">Same material, equal area, equal ΔT</text>
<text x="480" y="545" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203A5E" text-anchor="middle">Rod A transfers 60 J/s in the steady state</text>
