<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">One-kilometre coordinate grid</title><desc id="desc">Grid with eastings and northings from zero to six, one km per grid interval, north at top. School (1,1), Clinic (3,2), Market (5,2), Reservoir (4,5), Depot (1,4). Straight-line distances require Pythagoras.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">One-kilometre coordinate grid</text><text x="630" y="121" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">Grid spacing = 1 km</text><text x="856" y="121" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">N ↑</text><line x1="130" y1="120" x2="130" y2="450" stroke="#bacddd" stroke-width="1"/><text x="130" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">0</text><line x1="130" y1="450" x2="658" y2="450" stroke="#bacddd" stroke-width="1"/><text x="110" y="456" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">0</text><line x1="218" y1="120" x2="218" y2="450" stroke="#bacddd" stroke-width="1"/><text x="218" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">1</text><line x1="130" y1="395" x2="658" y2="395" stroke="#bacddd" stroke-width="1"/><text x="110" y="401" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">1</text><line x1="306" y1="120" x2="306" y2="450" stroke="#bacddd" stroke-width="1"/><text x="306" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">2</text><line x1="130" y1="340" x2="658" y2="340" stroke="#bacddd" stroke-width="1"/><text x="110" y="346" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">2</text><line x1="394" y1="120" x2="394" y2="450" stroke="#bacddd" stroke-width="1"/><text x="394" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">3</text><line x1="130" y1="285" x2="658" y2="285" stroke="#bacddd" stroke-width="1"/><text x="110" y="291" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">3</text><line x1="482" y1="120" x2="482" y2="450" stroke="#bacddd" stroke-width="1"/><text x="482" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">4</text><line x1="130" y1="230" x2="658" y2="230" stroke="#bacddd" stroke-width="1"/><text x="110" y="236" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">4</text><line x1="570" y1="120" x2="570" y2="450" stroke="#bacddd" stroke-width="1"/><text x="570" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">5</text><line x1="130" y1="175" x2="658" y2="175" stroke="#bacddd" stroke-width="1"/><text x="110" y="181" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">5</text><line x1="658" y1="120" x2="658" y2="450" stroke="#bacddd" stroke-width="1"/><text x="658" y="476" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">6</text><line x1="130" y1="120" x2="658" y2="120" stroke="#bacddd" stroke-width="1"/><text x="110" y="126" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="middle">6</text><circle cx="218" cy="395" r="9" fill="#a65331"/><text x="231" y="385" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">School</text><circle cx="394" cy="340" r="9" fill="#a65331"/><text x="407" y="330" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Clinic</text><circle cx="570" cy="340" r="9" fill="#a65331"/><text x="583" y="330" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Market</text><circle cx="482" cy="175" r="9" fill="#a65331"/><text x="495" y="165" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Reservoir</text><circle cx="218" cy="230" r="9" fill="#a65331"/><text x="231" y="220" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">Depot</text><text x="392" y="505" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="middle">Easting →</text><text x="57" y="290" font-family="Arial" font-size="16" font-weight="700" fill="#1f2937" text-anchor="start">Northing</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>