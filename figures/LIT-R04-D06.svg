<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Folded Invitation"><rect width="1200" height="490" rx="18" fill="#172554"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Folded Invitation  |  POETRY</text><rect x="34" y="99" width="737" height="319" rx="13" fill="#FFFFFF"/><text x="55" y="142" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0D6674" font-weight="700">01</text><text x="107" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">A paper bird lies folded in my hand;</text><text x="55" y="185" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0D6674" font-weight="700">02</text><text x="107" y="185" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">It carries words I have not dared to speak.</text><text x="55" y="228" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0D6674" font-weight="700">03</text><text x="107" y="228" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">The crowded hall is wider than the land;</text><text x="55" y="271" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0D6674" font-weight="700">04</text><text x="107" y="271" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">My voice, a candle, trembles small and weak.</text><text x="55" y="314" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0D6674" font-weight="700">05</text><text x="107" y="314" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">I open it; the little bird takes flight</text><text x="55" y="357" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#0D6674" font-weight="700">06</text><text x="107" y="357" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">As every face turns gently to the light.</text><rect x="792" y="100" width="374" height="318" rx="13" fill="#E9F7F6"/><text x="814" y="145" font-family="DejaVu Sans,sans-serif" font-size="22" fill="#125F64" font-weight="700">READING FOCUS</text><text x="816" y="199" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">• Line endings and pauses</text><text x="816" y="250" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">• Sound and repetition</text><text x="816" y="301" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">• Speaking voice and mood</text><text x="816" y="352" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#1D2D43">• Image and implication</text><text x="40" y="455" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#F4F6FB">Original verse layout. Locate a precise word or line before explaining its effect.</text></svg>