<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Shoreline change by transect</title><desc id="desc">Synthetic shoreline retreat in metres from 2018 to 2026 at four transects: West 12, Centre 5, East 17, Far east 9.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Shoreline change by transect</text><rect x="170.0" y="125" width="270" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="305.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Shoreline transect</text><rect x="440.0" y="125" width="350" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="615.0" y="165.5" font-family="Arial" font-size="14" font-weight="700" fill="#fff" text-anchor="middle">Retreat 2018–2026 (m)</text><rect x="170.0" y="192" width="270" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="305.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">West</text><rect x="440.0" y="192" width="350" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="615.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">12</text><rect x="170.0" y="259" width="270" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="305.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Centre</text><rect x="440.0" y="259" width="350" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="615.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">5</text><rect x="170.0" y="326" width="270" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="305.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">East</text><rect x="440.0" y="326" width="350" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="615.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">17</text><rect x="170.0" y="393" width="270" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="305.0" y="433.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Far east</text><rect x="440.0" y="393" width="350" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="615.0" y="433.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">9</text><text x="480" y="493" font-family="Arial" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Positive values indicate landward shoreline change</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>