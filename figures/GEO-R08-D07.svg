<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Hypothetical GIS layer update schedules</title><desc id="desc">Synthetic GIS update intervals in days: clinics 30, road closures 2, flood zones 365, land cover 180, school sites 90. Smaller value means more frequent updates.</desc><rect width="960" height="540" fill="#F4F8FC"/><rect x="12" y="12" width="936" height="516" rx="18" fill="#FFFFFF" stroke="#CBD9E5"/><rect x="12" y="12" width="936" height="81" rx="18" fill="#1F2A44"/><rect x="12" y="70" width="936" height="23" fill="#1F2A44"/><text x="480" y="63" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Hypothetical GIS layer update schedules</text><rect x="135" y="130.0" width="430" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="350.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">GIS layer</text><rect x="565" y="130.0" width="260" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="695.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Update interval (days)</text><rect x="135" y="185.0" width="430" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="350.0" y="218.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">Clinics</text><rect x="565" y="185.0" width="260" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="695.0" y="218.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">30</text><rect x="135" y="240.0" width="430" height="55.0" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="350.0" y="273.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">Road closures</text><rect x="565" y="240.0" width="260" height="55.0" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="695.0" y="273.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">2</text><rect x="135" y="295.0" width="430" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="350.0" y="328.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">Flood zones</text><rect x="565" y="295.0" width="260" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="695.0" y="328.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">365</text><rect x="135" y="350.0" width="430" height="55.0" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="350.0" y="383.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">Land cover</text><rect x="565" y="350.0" width="260" height="55.0" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="695.0" y="383.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">180</text><rect x="135" y="405.0" width="430" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="350.0" y="438.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">School sites</text><rect x="565" y="405.0" width="260" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="695.0" y="438.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">90</text><text x="480" y="516" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#667C91">Illustrative classroom dataset · not observed or official data</text></svg>