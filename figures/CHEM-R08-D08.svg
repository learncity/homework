<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><title>CHEM-R08-D08: Ethene addition-polymerisation</title><desc>Visible diagram labels: Ethene addition-polymerisation; Monomer: ethene; H₂C = CH₂; →; Poly(ethene); [–CH₂–CH₂–]ₙ; Addition polymerisation: no small molecule is eliminated.. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="820" height="440" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" rx="5" /><text x="410" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#183153" font-weight="bold" text-anchor="middle">Ethene addition-polymerisation</text><line x1="36" y1="56" x2="784" y2="56" stroke="#DA9700" stroke-width="4" /><rect x="47" y="122" width="302" height="174" fill="#F3F8FE" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="195" y="109" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#183153" font-weight="bold" text-anchor="middle">Monomer: ethene</text><text x="196" y="216" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#216A92" font-weight="bold" text-anchor="middle">H₂C = CH₂</text><text x="410" y="218" font-family="Arial,DejaVu Sans,sans-serif" font-size="47" fill="#B47F0D" font-weight="bold" text-anchor="middle">→</text><rect x="469" y="122" width="302" height="174" fill="#F3F8FE" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="620" y="109" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#183153" font-weight="bold" text-anchor="middle">Poly(ethene)</text><text x="620" y="216" font-family="Arial,DejaVu Sans,sans-serif" font-size="29" fill="#216A92" font-weight="bold" text-anchor="middle">[–CH₂–CH₂–]ₙ</text><text x="410" y="362" font-family="Arial,DejaVu Sans,sans-serif" font-size="19" fill="#183153" font-weight="normal" text-anchor="middle">Addition polymerisation: no small molecule is eliminated.</text></svg>