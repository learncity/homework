<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Capillary physics examination diagram">
<title>Capillary physics examination diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Water rise in two capillary tubes</text>
<rect x="180" y="369" width="600" height="85" fill="#D5EDFB" stroke="#203A5E" stroke-width="3"/>
<rect x="319" y="160" width="42" height="220" fill="#FFFFFF" stroke="#203A5E" stroke-width="3"/>
<rect x="325" y="279" width="30" height="90" fill="#83C8EA" stroke="none" stroke-width="0"/>
<line x1="319" y1="160" x2="319" y2="380" stroke="#203A5E" stroke-width="3"/>
<line x1="361" y1="160" x2="361" y2="380" stroke="#203A5E" stroke-width="3"/>
<text x="340" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#203A5E" text-anchor="middle">r = 0.5 mm</text>
<text x="410" y="283" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#203A5E" text-anchor="middle">3 cm</text>
<rect x="579" y="160" width="42" height="220" fill="#FFFFFF" stroke="#203A5E" stroke-width="3"/>
<rect x="585" y="324.0" width="30" height="45.0" fill="#83C8EA" stroke="none" stroke-width="0"/>
<line x1="579" y1="160" x2="579" y2="380" stroke="#203A5E" stroke-width="3"/>
<line x1="621" y1="160" x2="621" y2="380" stroke="#203A5E" stroke-width="3"/>
<text x="600" y="147" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#203A5E" text-anchor="middle">r = 1 mm</text>
<text x="670" y="328.0" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#203A5E" text-anchor="middle">1.5 cm</text>
<text x="480" y="509" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#203A5E" text-anchor="middle">Both tubes are clean and made from the same glass</text>
</svg>