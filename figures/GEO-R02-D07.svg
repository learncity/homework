<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Synthetic rainfall transect</title><desc id="svgDesc">Schematic annual rainfall values increasing from north to south: Coast 2400 mm, Forest 1800 mm, Guinea savanna 1150 mm, Sudan savanna 650 mm, Sahel fringe 350 mm.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Synthetic rainfall transect</text><text x="60" y="117" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">Rainfall (mm/year): schematic south → north</text><rect x="85" y="148.0" width="92" height="252.0" rx="4" fill="#206b64" stroke="#206b64"/><text x="131" y="139.0" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">2400</text><text x="131" y="426" font-family="Arial" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Coast</text><rect x="233" y="211.0" width="92" height="189.0" rx="4" fill="#278f68" stroke="#278f68"/><text x="279" y="202.0" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">1800</text><text x="279" y="426" font-family="Arial" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Forest</text><rect x="381" y="279.25" width="92" height="120.75" rx="4" fill="#7baa4b" stroke="#7baa4b"/><text x="427" y="270.25" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">1150</text><text x="427" y="426" font-family="Arial" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Guinea</text><rect x="529" y="331.75" width="92" height="68.25" rx="4" fill="#c4b75b" stroke="#c4b75b"/><text x="575" y="322.75" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">650</text><text x="575" y="426" font-family="Arial" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Sudan</text><rect x="677" y="363.25" width="92" height="36.75" rx="4" fill="#d2af72" stroke="#d2af72"/><text x="723" y="354.25" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">350</text><text x="723" y="426" font-family="Arial" font-size="17" font-weight="700" fill="#1e293b" text-anchor="middle">Sahel</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>