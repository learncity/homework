<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Library Window"><rect width="1200" height="490" rx="18" fill="#0F4252"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Library Window  |  DRAMA</text><rect x="34" y="104" width="754" height="308" rx="13" fill="#FFFFFF"/><text x="54" y="143" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#19576B" font-weight="700">SPEAKING TURNS</text><text x="55" y="178" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">LIBRARIAN</text><text x="276" y="178" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">These books must remain behind the</text><text x="276" y="197" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">glass.</text><text x="55" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">STUDENT</text><text x="276" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">How can we study the</text><text x="276" y="250" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">illustrations?</text><text x="55" y="284" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">LIBRARIAN</text><text x="276" y="284" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">The pages are too fragile for</text><text x="276" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">handling.</text><text x="55" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">STUDENT</text><text x="276" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">Could we make a reading copy?</text><rect x="805" y="104" width="361" height="308" rx="13" fill="#E9F0FB"/><text x="826" y="143" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#19576B" font-weight="700">STAGE NOTATION</text><text x="825" y="181" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">STUDENT [pointing to a</text><text x="825" y="211" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">scanner]: Could we make a</text><text x="825" y="241" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">reading copy?</text><text x="40" y="454" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#F4F6FB">Consider how speech and visible movement work together. No answer is supplied.</text></svg>