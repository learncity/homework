<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Field elevation grid</title><desc id="svgDesc">A three-by-three grid of nine survey positions, north at the top. North row A 90 m, B 120 m, C 85 m; middle row D 60 m, E 80 m, F 70 m; south row G 45 m, H 55 m, I 50 m.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Field elevation grid</text><text x="65" y="118" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">North ↑</text><text x="430" y="118" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">Elevation (metres)</text><rect x="95" y="145" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="165" y="170" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">A</text><text x="165" y="197" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">90 m</text><rect x="265" y="145" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="335" y="170" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">B</text><text x="335" y="197" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">120 m</text><rect x="435" y="145" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="505" y="170" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">C</text><text x="505" y="197" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">85 m</text><rect x="95" y="235" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="165" y="260" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">D</text><text x="165" y="287" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">60 m</text><rect x="265" y="235" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="335" y="260" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">E</text><text x="335" y="287" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">80 m</text><rect x="435" y="235" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="505" y="260" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">F</text><text x="505" y="287" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">70 m</text><rect x="95" y="325" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="165" y="350" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">G</text><text x="165" y="377" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">45 m</text><rect x="265" y="325" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="335" y="350" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">H</text><text x="335" y="377" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">55 m</text><rect x="435" y="325" width="140" height="68" rx="9" fill="#dcecf9" stroke="#7ba6c7"/><text x="505" y="350" font-family="Arial" font-size="22" font-weight="700" fill="#1e293b" text-anchor="middle">I</text><text x="505" y="377" font-family="Arial" font-size="19" font-weight="400" fill="#1e293b" text-anchor="middle">50 m</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>