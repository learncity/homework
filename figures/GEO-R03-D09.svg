<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Cross-border corridor trade movements</title><desc id="desc">Three illustrative regional trade corridors with monthly movements measured in thousand units. A exports 54, imports 48; B exports 42, imports 46; C exports 30, imports 18. These are not official ECOWAS statistics.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Cross-border corridor trade movements</text><text x="65" y="114" font-family="Arial" font-size="18" font-weight="600" fill="#1f2937" text-anchor="start">Constructed monthly quantities in thousand units</text><rect x="92.5" y="125" width="285" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="235.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Corridor</text><rect x="377.5" y="125" width="245" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="500.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Exports</text><rect x="622.5" y="125" width="245" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="745.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Imports</text><rect x="92.5" y="192" width="285" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="235.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Corridor A</text><rect x="377.5" y="192" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="500.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">54</text><rect x="622.5" y="192" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="745.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">48</text><rect x="92.5" y="259" width="285" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="235.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Corridor B</text><rect x="377.5" y="259" width="245" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="500.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">42</text><rect x="622.5" y="259" width="245" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="745.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">46</text><rect x="92.5" y="326" width="285" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="235.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Corridor C</text><rect x="377.5" y="326" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="500.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">30</text><rect x="622.5" y="326" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="745.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">18</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>