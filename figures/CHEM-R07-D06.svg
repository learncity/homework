<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><title>CHEM-R07-D06: Copper electrorefining cell</title><desc>Visible diagram labels: Copper electrorefining cell; Cu anode (+); Cu cathode (−); CuSO₄(aq); Cu²⁺ →; Copper transfers from anode to cathode. These labels are not a verified scientific description; teacher review is required.</desc><rect width="640" height="360" fill="#FFFFFF" /><text x="320" y="37" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#172B46" font-weight="bold" text-anchor="middle">Copper electrorefining cell</text><line x1="40" y1="55" x2="600" y2="55" stroke="#F2A900" stroke-width="3" /><rect x="142" y="105" width="360" height="204" rx="6" fill="#E0F2FE" stroke="#427A9D" stroke-width="2" /><line x1="227" y1="120" x2="227" y2="264" stroke="#A86230" stroke-width="13" /><line x1="415" y1="120" x2="415" y2="264" stroke="#A86230" stroke-width="13" /><text x="227" y="95" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#172B46" font-weight="normal" text-anchor="middle">Cu anode (+)</text><text x="420" y="95" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#172B46" font-weight="normal" text-anchor="middle">Cu cathode (−)</text><text x="320" y="297" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" fill="#172B46" font-weight="normal" text-anchor="middle">CuSO₄(aq)</text><text x="314" y="192" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" fill="#0A65A4" font-weight="bold" text-anchor="middle">Cu²⁺ →</text><text x="320" y="333" font-family="DejaVu Sans,Arial,sans-serif" font-size="15" fill="#172B46" font-weight="normal" text-anchor="middle">Copper transfers from anode to cathode</text></svg>