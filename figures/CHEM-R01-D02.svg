<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"><title>CHEM-R01-D02: B. Chromatography of a coloured mixture</title><desc>Visible diagram labels: B. Chromatography of a coloured mixture; Spot A: 12 cm; Spot B: 8 cm; Origin: 0 cm; Solvent front: 15 cm; Distances measured from the pencil baseline; solvent moves upwards. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="760" height="430" fill="#ffffff" /><style>text{font-family:Arial, sans-serif;fill:#15263d} .label{font-size:19px} .small{font-size:16px} .head{font-size:25px;font-weight:bold} .line{stroke:#1f3852;stroke-width:4;fill:none;stroke-linecap:round} .thin{stroke:#1f3852;stroke-width:2;fill:none} .liq{fill:#c8e7f2;stroke:#1f3852;stroke-width:2} .warm{fill:#f5d9c2;stroke:#1f3852;stroke-width:2} .neutral{fill:#e5e7eb;stroke:#1f3852;stroke-width:2} .point{fill:#e35d54} .ink{fill:#405ad6}</style><text x="35" y="40" class="head">B. Chromatography of a coloured mixture</text><rect x="175" y="105" width="300" height="260" class="liq" /><rect x="185" y="285" width="280" height="70" class="liq" /><rect x="275" y="135" width="80" height="190" class="warm" /><line x1="260" y1="300" x2="372" y2="300" class="thin" /><circle cx="310" cy="285" r="8" stroke="#1f3852" stroke-width="3" fill="#e35d54" /><circle cx="310" cy="204" r="9" stroke="#1f3852" stroke-width="3" fill="#4962d7" /><circle cx="310" cy="156" r="9" stroke="#1f3852" stroke-width="3" fill="#e3a42f" /><text x="495" y="160" class="label">Spot A: 12 cm</text><text x="495" y="204" class="label">Spot B: 8 cm</text><text x="495" y="290" class="label">Origin: 0 cm</text><text x="490" y="126" class="label">Solvent front: 15 cm</text><line x1="275" y1="120" x2="355" y2="120" class="thin" /><text x="45" y="395" class="label">Distances measured from the pencil baseline; solvent moves upwards</text></svg>