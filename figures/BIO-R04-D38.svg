<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title desc"><title id="title">New cases recorded each week</title><desc id="desc">The five weekly new-case counts are 12, 9, 7, 5 and 4 for weeks one to five.</desc><rect x="0" y="0" width="880" height="540" rx="0" fill="#F7FAFC" stroke="none"/><rect x="0" y="0" width="880" height="88" rx="0" fill="#1F2A44" stroke="none"/><text x="34" y="55" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="white">New cases recorded each week</text><text x="35" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">BIOLOGY • EVIDENCE PANEL D38</text><rect x="58" y="229" width="85" height="216" rx="5" fill="#6A91B0" stroke="none"/><text x="100" y="215" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">12</text><text x="100" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182941">Week 1</text><rect x="221" y="283" width="85" height="162" rx="5" fill="#6A91B0" stroke="none"/><text x="263" y="269" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">9</text><text x="263" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182941">Week 2</text><rect x="384" y="319" width="85" height="126" rx="5" fill="#6A91B0" stroke="none"/><text x="426" y="305" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">7</text><text x="426" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182941">Week 3</text><rect x="547" y="355" width="85" height="90" rx="5" fill="#6A91B0" stroke="none"/><text x="589" y="341" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">5</text><text x="589" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182941">Week 4</text><rect x="710" y="373" width="85" height="72" rx="5" fill="#6A91B0" stroke="none"/><text x="752" y="359" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">4</text><text x="752" y="474" text-anchor="middle" font-family="Arial, sans-serif" font-size="17" font-weight="normal" fill="#182941">Week 5</text><line x1="40" y1="445" x2="846" y2="445" stroke="#64748B" stroke-width="2"/><text x="35" y="508" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="normal" fill="#64748B">Five observation weeks; no causal intervention is specified.</text></svg>