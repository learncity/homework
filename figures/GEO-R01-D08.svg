<title id="t">GIS suitability classification grid</title><desc id="d">Synthetic four by four raster grid with rows A through D and columns one through four. Row A: F F R R. Row B: F S S R. Row C: F S S R. Row D: W W S S. F flood-risk, S suitable flat land, R road corridor, W wetland. Each cell 100 by 100 metres.</desc>
