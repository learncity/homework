<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Painted Exit"><rect width="1200" height="490" rx="18" fill="#0F4252"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Painted Exit  |  DRAMA</text><rect x="34" y="104" width="754" height="308" rx="13" fill="#FFFFFF"/><text x="54" y="143" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#19576B" font-weight="700">SPEAKING TURNS</text><text x="55" y="178" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">DESIGNER</text><text x="276" y="178" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">The arrow points towards the</text><text x="276" y="197" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">painted door.</text><text x="55" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">ACTOR</text><text x="276" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">But the audience will think it is</text><text x="276" y="250" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">a real exit.</text><text x="55" y="284" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">DIRECTOR</text><text x="276" y="284" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">Turn the arrow towards the lit</text><text x="276" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">passage instead.</text><rect x="805" y="104" width="361" height="308" rx="13" fill="#E9F0FB"/><text x="826" y="143" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#19576B" font-weight="700">STAGE NOTATION</text><text x="825" y="181" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">DIRECTOR [walking to the</text><text x="825" y="211" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">edge of the stage]: Turn the</text><text x="825" y="241" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">arrow towards the lit</text><text x="825" y="271" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">passage instead.</text><text x="40" y="454" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#F4F6FB">Consider how speech and visible movement work together. No answer is supplied.</text></svg>