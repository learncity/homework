<svg xmlns="http://www.w3.org/2000/svg" width="686" height="420" viewBox="0 0 686 420" role="img"><title>Props and Dialogue</title><desc>Compare what the audience sees with what is said.</desc><rect x="0" y="0" width="686" height="420" rx="22" fill="#F8F7F3"/><rect x="17" y="16" width="652" height="66" rx="14" fill="#172E47"/><text x="40" y="57" font-family="Arial, sans-serif" font-size="25" font-weight="700" fill="white">Props and Dialogue</text><text x="645" y="57" font-family="Arial, sans-serif" font-size="11" font-weight="700" fill="#CADCE1" text-anchor="end">DRAMA</text><rect x="54" y="121" width="296" height="209" rx="14" fill="#DEE5E7"/><rect x="84" y="156" width="219" height="133" rx="5" fill="#FFFDFC" stroke="#366786" stroke-width="2"/><path d="M84 156 L193 232 L303 156" fill="none" stroke="#366786" stroke-width="3" stroke-linejoin="round" stroke-linecap="round"/><text x="189" y="270" font-family="Arial, sans-serif" font-size="17" font-weight="700" fill="#172E47" text-anchor="middle">UNSENT?</text><rect x="386" y="126" width="225" height="198" rx="14" fill="#ECF2F1" stroke="#2F827E" stroke-width="2"/><text x="410" y="163" font-family="Arial, sans-serif" font-size="16" font-weight="700" fill="#172E47">SPOKEN CLAIM</text><text x="410" y="204" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#304456">Who assumes?</text><text x="410" y="253" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#304456">What is visible?</text><rect x="19" y="362" width="649" height="42" rx="10" fill="#ECF2F1"/><text x="36" y="388" font-family="Arial, sans-serif" font-size="15" font-weight="400" fill="#172E47">Compare what the audience sees with what is said.</text></svg>