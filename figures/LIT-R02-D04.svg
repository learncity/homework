<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Orange Tree"><rect width="1200" height="490" rx="18" fill="#24435C"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Orange Tree  |  PROSE</text><rect x="33" y="100" width="370" height="304" rx="13" fill="#FFFFFF"/><text x="52" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#145B72" font-weight="700">EARLY DETAIL</text><path d="M51 156 h334" stroke="#7CD4CB" stroke-width="3"/><text x="53" y="191" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">At the family compound, the</text><text x="53" y="220" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">oldest orange tree stood</text><text x="53" y="249" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">beside a broken wall.</text><rect x="423" y="100" width="370" height="304" rx="13" fill="#FFFFFF"/><text x="442" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#145B72" font-weight="700">ANOTHER DETAIL</text><path d="M441 156 h334" stroke="#7CD4CB" stroke-width="3"/><text x="443" y="191" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">Fola wanted it cut down so</text><text x="443" y="220" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">a new shop could have a</text><text x="443" y="249" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">wider entrance.</text><rect x="813" y="100" width="370" height="304" rx="13" fill="#FFFFFF"/><text x="832" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#145B72" font-weight="700">ENDING DETAIL</text><path d="M831 156 h334" stroke="#7CD4CB" stroke-width="3"/><text x="833" y="191" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">The shop would still open,</text><text x="833" y="220" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">and the tree would keep its</text><text x="833" y="249" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">shade.</text><text x="40" y="454" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#F4F6FB">Compare the details. Which changes the direction of the narrative, and why?</text></svg>