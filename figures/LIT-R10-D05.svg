<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="Blank close-reading organiser for Noon by Footstep"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="2"/><rect x="25" y="25" width="1050" height="106" rx="18" fill="#20344F" stroke="#20344F" stroke-width="2"/><text x="52" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#FFFFFF">Noon by Footstep</text><text x="1038" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#F6D5A8">FIG 05</text><rect x="38" y="578" width="1025" height="55" rx="10" fill="#E6EDF5" stroke="#E6EDF5" stroke-width="2"/><text x="62" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">Mark the sound, the pause, and the later reassessment.</text><circle cx="112" cy="330" r="68" fill="#315F93"/><text x="112" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#FFFFFF">1</text><text x="112" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#20344F">SILENCE</text><text x="112" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A697B">Opening condition</text><path d="M185 330 L275 330" stroke="#B6C7D5" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="349" cy="330" r="68" fill="#735A9E"/><text x="349" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#FFFFFF">2</text><text x="349" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#20344F">RHYTHM</text><text x="349" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A697B">Notice a repeated sound</text><path d="M422 330 L512 330" stroke="#B6C7D5" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="586" cy="330" r="68" fill="#B26E35"/><text x="586" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#FFFFFF">3</text><text x="586" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#20344F">CHANGE</text><text x="586" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A697B">Locate a narrative shift</text><path d="M659 330 L749 330" stroke="#B6C7D5" stroke-width="4" stroke-linecap="round" fill="none"/><circle cx="823" cy="330" r="68" fill="#19796E"/><text x="823" y="342" font-family="DejaVu Sans,Arial,sans-serif" font-size="34" font-weight="700" text-anchor="middle" fill="#FFFFFF">4</text><text x="823" y="448" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="middle" fill="#20344F">AFTER</text><text x="823" y="479" font-family="DejaVu Sans,Arial,sans-serif" font-size="14" font-weight="400" text-anchor="middle" fill="#5A697B">How does the ending qualify it?</text></svg>