<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Land cover classification change</title><desc id="desc">Synthetic remote-sensing classification across 100 square kilometres. Forest 50 percent 2015 to 35 percent 2025; Built-up 18 to 30; Wetland 22 to 17; Farmland 10 to 18. Each year totals 100 percent.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Land cover classification change</text><text x="55" y="115" font-family="Arial" font-size="18" font-weight="600" fill="#1f2937" text-anchor="start">Classification of same 100 km² study region</text><rect x="87.5" y="125" width="285" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="230.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Land cover</text><rect x="372.5" y="125" width="250" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="497.5" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2015 (%)</text><rect x="622.5" y="125" width="250" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="747.5" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">2025 (%)</text><rect x="87.5" y="192" width="285" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="230.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Forest</text><rect x="372.5" y="192" width="250" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="497.5" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">50</text><rect x="622.5" y="192" width="250" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df