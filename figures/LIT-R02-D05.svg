<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Festival Answer"><rect width="1200" height="490" rx="18" fill="#283B37"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Festival Answer  |  ORAL</text><rect x="40" y="108" width="1120" height="65" rx="13" fill="#FAEECF"/><text x="63" y="147" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1A6075" font-weight="700">LEAD SINGER</text><text x="318" y="147" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">Who carried the clay from the river?</text><rect x="40" y="185" width="1120" height="65" rx="13" fill="#DDF3F1"/><text x="63" y="224" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1A6075" font-weight="700">CROWD</text><text x="318" y="224" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">The hands that were never named!</text><rect x="40" y="262" width="1120" height="65" rx="13" fill="#FAEECF"/><text x="63" y="301" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1A6075" font-weight="700">LEAD SINGER</text><text x="318" y="301" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">Who shaped it beneath the sun?</text><rect x="40" y="339" width="1120" height="65" rx="13" fill="#DDF3F1"/><text x="63" y="378" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1A6075" font-weight="700">CROWD</text><text x="318" y="378" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">The hands that were never named!</text><text x="40" y="456" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#F4F6FB">Observe the relationship between the lead call and the group response.</text></svg>