<svg xmlns="http://www.w3.org/2000/svg" width="686" height="420" viewBox="0 0 686 420" role="img"><title>Symbol or object?</title><desc>Link an interpretation to repeated contextual clues.</desc><rect x="0" y="0" width="686" height="420" rx="16" fill="#F6F4EF"/><rect x="20" y="18" width="646" height="63" rx="14" fill="#15334B"/><text x="43" y="58" fill="#FFFFFF" font-size="24" font-weight="700" font-family="Arial,sans-serif">Symbol or object?</text><rect x="34" y="126" width="256" height="179" rx="14" fill="#267E83"/><text x="64" y="170" fill="white" font-size="19" font-weight="700" font-family="Arial,sans-serif">LITERAL OBJECT</text><text x="62" y="230" fill="white" font-size="15" font-weight="400" font-family="Arial,sans-serif">What is actually there?</text><rect x="395" y="126" width="256" height="179" rx="14" fill="#4D6686"/><text x="420" y="170" fill="white" font-size="19" font-weight="700" font-family="Arial,sans-serif">IMPLIED MEANING</text><text x="414" y="230" fill="white" font-size="15" font-weight="400" font-family="Arial,sans-serif">What can it suggest?</text><path d="M293 220 L392 220" stroke="#B67636" stroke-width="5" fill="none" stroke-linecap="round"/><circle cx="343" cy="220" r="22" fill="#B67636"/><text x="334" y="227" fill="white" font-size="19" font-weight="700" font-family="Arial,sans-serif">?</text><rect x="21" y="365" width="644" height="40" rx="9" fill="#E8F0F1"/><text x="35" y="391" fill="#15334B" font-size="13" font-weight="400" font-family="Arial,sans-serif">Link an interpretation to repeated contextual clues.</text></svg>