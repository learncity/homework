<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 900 510" width="900" height="510"><title id="title">Simplified double-circulation pathway</title><desc id="desc">Flow direction: body tissues to right heart to lungs to left heart to body tissues. Details such as valves and four chambers are not drawn.</desc><defs><marker id="a" markerWidth="11" markerHeight="11" refX="9" refY="4" orient="auto"><path d="M0 0 L9 4 L0 8" fill="none" stroke="#19647D" stroke-width="2"/></marker></defs><rect width="900" height="510" fill="#FBFEFF"/><text x="450" y="55" font-family="Arial" font-size="28" font-weight="bold" text-anchor="middle" fill="#17415A">Double circulation — direction of flow</text><rect x="70" y="175" width="155" height="120" rx="18" fill="#E9F1F7" stroke="#286A83" stroke-width="2"/><text x="147.5" y="245" font-family="Arial" font-size="20" text-anchor="middle">BODY</text><rect x="260" y="175" width="180" height="120" rx="18" fill="#DCE9F2" stroke="#286A83" stroke-width="2"/><text x="350.0" y="245" font-family="Arial" font-size="20" text-anchor="middle">RIGHT HEART</text><rect x="480" y="175" width="155" height="120" rx="18" fill="#DDF1EC" stroke="#286A83" stroke-width="2"/><text x="557.5" y="245" font-family="Arial" font-size="20" text-anchor="middle">LUNGS</text><rect x="670" y="175" width="180" height="120" rx="18" fill="#F9E4E4" stroke="#286A83" stroke-width="2"/><text x="760.0" y="245" font-family="Arial" font-size="20" text-anchor="middle">LEFT HEART</text><line x1="225" y1="235" x2="252" y2="235" stroke="#19647D" stroke-width="4" marker-end="url(#a)"/><line x1="440" y1="235" x2="472" y2="235" stroke="#19647D" stroke-width="4" marker-end="url(#a)"/><line x1="635" y1="235" x2="662" y2="235" stroke="#19647D" stroke-width="4" marker-end="url(#a)"/><path d="M850 225 L855 355 L150 355 L150 299" fill="none" stroke="#19647D" stroke-width="4" marker-end="url(#a)"/><text x="450" y="388" text-anchor="middle" font-family="Arial" font-size="18" fill="#355666">Systemic return to body and right heart shown by directional loop</text></svg>