<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="ttl desc">
<title id="ttl">Safe handwashing demonstration</title>
<desc id="desc">Safe handwashing demonstration. Before wash 64, Water only 48, Soap 10 s 17, Soap 30 s 6. Fluorescent markers indicate surface removal, not a measured infection rate.</desc>
<rect width="960" height="570" fill="#ffffff"/>
<text x="480" y="49" text-anchor="middle" font-family="Arial,sans-serif" font-size="26" font-weight="700" fill="#15253a">Safe handwashing demonstration</text>
<text x="110" y="86" font-family="Arial,sans-serif" font-size="16" fill="#3f536c">Illustrative classroom dataset • not clinical or published measurements</text>
<line x1="110" y1="465.0" x2="900" y2="465.0" stroke="#dce5ee" stroke-width="1"/>
<text x="95" y="470.0" text-anchor="end" font-family="Arial" font-size="18" fill="#41556a">0</text>
<line x1="110" y1="394.0" x2="900" y2="394.0" stroke="#dce5ee" stroke-width="1"/>
<text x="95" y="399.0" text-anchor="end" font-family="Arial" font-size="18" fill="#41556a">16</text>
<line x1="110" y1="323.0" x2="900" y2="323.0" stroke="#dce5ee" stroke-width="1"/>
<text x="95" y="328.0" text-anchor="end" font-family="Arial" font-size="18" fill="#41556a">32</text>
<line x1="110" y1="252.0" x2="900" y2="252.0" stroke="#dce5ee" stroke-width="1"/>
<text x="95" y="257.0" text-anchor="end" font-family="Arial" font-size="18" fill="#41556a">48</text>
<line x1="110" y1="181.0" x2="900" y2="181.0" stroke="#dce5ee" stroke-width="1"/>
<text x="95" y="186.0" text-anchor="end" font-family="Arial" font-size="18" fill="#41556a">64</text>
<line x1="110" y1="110.0" x2="900" y2="110.0" stroke="#dce5ee" stroke-width="1"/>
<text x="95" y="115.0" text-anchor="end" font-family="Arial" font-size="18" fill="#41556a">80</text>
<rect x="156.0" y="181.0" width="110" height="284.0" rx="8" fill="#256b83"/>
<text x="211.0" y="171.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#163b4c">64</text>
<text x="211.0" y="494.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#253c51">Before wash</text>
<rect x="353.5" y="252.0" width="110" height="213.0" rx="8" fill="#256b83"/>
<text x="408.5" y="242.0" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#163b4c">48</text>
<text x="408.5" y="494.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#253c51">Water only</text>
<rect x="551.0" y="389.6" width="110" height="75.4" rx="8" fill="#256b83"/>
<text x="606.0" y="379.6" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#163b4c">17</text>
<text x="606.0" y="494.0" text-anchor="middle" font-family="Arial" font-size="17" fill="#253c51">Soap 10 s</text>
<rect x="748.5" y="438.4" width="110" height="26.6" rx="8" fill="#256b83"/>
<text x="803.5" y="428.4" text-anchor="middle" font-family="Arial" font-size="20" font-weight="700" fill="#163b4c">6</text>
