<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><title>CHEM-R06-D02: Soap-lather comparison</title><desc>Visible diagram labels: Soap-lather comparison; Lather heights after equal shaking and reagent volumes; Same soap volume added to each 50 cm³ sample; A; 80 mm lather; B; 200 mm lather; C; 145 mm lather; More lather indicates less hardness (other conditions constant).. These labels are not a verified scientific description; teacher review is required.</desc><rect width="920" height="520" fill="#ffffff" /><rect width="920" height="86" fill="#17324d" /><text x="34" y="39" font-size="25" font-family="Arial" font-weight="700" fill="#ffffff">Soap-lather comparison</text><text x="34" y="69" font-size="16" font-family="Arial" fill="#e3eff7">Lather heights after equal shaking and reagent volumes</text><text x="100" y="130" font-size="19" font-family="Arial" fill="#17324d">Same soap volume added to each 50 cm³ sample</text><rect x="135" y="205" width="110" height="220" rx="8" fill="#f5f8fb" stroke="#475569" stroke-width="2" /><rect x="140" y="345" width="100" height="80" rx="8" fill="#7ac6c0" stroke="#475569" stroke-width="2" /><text x="170" y="470" font-size="24" font-family="Arial" fill="#17324d">A</text><text x="125" y="188" font-size="18" font-family="Arial" fill="#17324d">80 mm lather</text><rect x="370" y="205" width="110" height="220" rx="8" fill="#f5f8fb" stroke="#475569" stroke-width="2" /><rect x="375" y="225" width="100" height="200" rx="8" fill="#7ac6c0" stroke="#475569" stroke-width="2" /><text x="405" y="470" font-size="24" font-family="Arial" fill="#17324d">B</text><text x="360" y="188" font-size="18" font-family="Arial" fill="#17324d">200 mm lather</text><rect x="605" y="205" width="110" height="220" rx="8" fill="#f5f8fb" stroke="#475569" stroke-width="2" /><rect x="610" y="280" width="100" height="145" rx="8" fill="#7ac6c0" stroke="#475569" stroke-width="2" /><text x="640" y="470" font-size="24" font-family="Arial" fill="#17324d">C</text><text x="595" y="188" font-size="18" font-family="Arial" fill="#17324d">145 mm lather</text><text x="100" y="505" font-size="17" font-family="Arial" fill="#17324d">More lather indicates less hardness (other conditions constant).</text></svg>