<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" width="900" height="510" viewBox="0 0 900 510"><title id="title">Punnett square for Aa × aa</title><desc id="desc">Columns are gametes A and a from the heterozygous parent. Rows are gametes a and a from the recessive parent. Cells are Aa, aa, Aa and aa.</desc><rect width="900" height="510" fill="#FCFEFF"/><text x="450" y="55" text-anchor="middle" font-family="Arial" font-size="29" fill="#194C5A" font-weight="bold">Monohybrid cross: Aa × aa</text><text x="460" y="110" text-anchor="middle" font-family="Arial" font-size="19">Gametes from Aa parent</text><text x="365" y="155" text-anchor="middle" font-family="Arial" font-size="27">A</text><text x="515" y="155" text-anchor="middle" font-family="Arial" font-size="27">a</text><text x="255" y="240" text-anchor="middle" font-family="Arial" font-size="27">a</text><rect x="290" y="180" width="145" height="110" fill="#DBF1EE" stroke="#2B6279" stroke-width="2"/><text x="362" y="245" text-anchor="middle" font-family="Arial" font-size="30" fill="#173E4A">Aa</text><rect x="440" y="180" width="145" height="110" fill="#F8E7D8" stroke="#2B6279" stroke-width="2"/><text x="512" y="245" text-anchor="middle" font-family="Arial" font-size="30" fill="#173E4A">aa</text><text x="255" y="358" text-anchor="middle" font-family="Arial" font-size="27">a</text><rect x="290" y="298" width="145" height="110" fill="#DBF1EE" stroke="#2B6279" stroke-width="2"/><text x="362" y="363" text-anchor="middle" font-family="Arial" font-size="30" fill="#173E4A">Aa</text><rect x="440" y="298" width="145" height="110" fill="#F8E7D8" stroke="#2B6279" stroke-width="2"/><text x="512" y="363" text-anchor="middle" font-family="Arial" font-size="30" fill="#173E4A">aa</text><text x="450" y="453" text-anchor="middle" font-family="Arial" font-size="16" fill="#38515E">Second parent = aa • genotype ratio Aa:aa = 1:1</text></svg>