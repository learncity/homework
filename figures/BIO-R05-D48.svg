<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="t d"><title id="t">Pollinator observations across four plots</title><desc id="d">Fixed-length observation visits on the same date; counts are illustrative. Data: Plot A 4 visits, Plot B 8 visits, Plot C 12 visits, Plot D 6 visits.</desc>
