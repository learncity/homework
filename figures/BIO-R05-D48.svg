<text x="348" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">Plot B</text>
<rect x="495" y="160.0" width="106" height="295.0" rx="5" fill="#276B9B"/>
<text x="548" y="152.0" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">12</text>
