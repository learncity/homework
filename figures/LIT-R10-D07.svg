<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="Blank close-reading organiser for The Half-Painted Sign"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="2"/><rect x="25" y="25" width="1050" height="106" rx="18" fill="#20344F" stroke="#20344F" stroke-width="2"/><text x="52" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#FFFFFF">The Half-Painted Sign</text><text x="1038" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#F6D5A8">FIG 07</text><rect x="38" y="578" width="1025" height="55" rx="10" fill="#E6EDF5" stroke="#E6EDF5" stroke-width="2"/><text x="62" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">A revision should be justified by legibility and audience purpose.</text><rect x="64" y="190" width="312" height="320" rx="18" fill="#FFFFFF" stroke="#735A9E" stroke-width="2"/><rect x="64" y="190" width="312" height="56" rx="18" fill="#735A9E" stroke="#735A9E" stroke-width="2"/><text x="86" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">FIRST DRAFT</text><text x="87" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">Locate the original difficulty.</text><path d="M86 481 L353 481" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="396" y="190" width="312" height="320" rx="18" fill="#FFFFFF" stroke="#B26E35" stroke-width="2"/><rect x="396" y="190" width="312" height="56" rx="18" fill="#B26E35" stroke="#B26E35" stroke-width="2"/><text x="418" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">CHECK</text><text x="419" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">Which clue invites revision?</text><path d="M418 481 L685 481" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="728" y="190" width="312" height="320" rx="18" fill="#FFFFFF" stroke="#19796E" stroke-width="2"/><rect x="728" y="190" width="312" height="56" rx="18" fill="#19796E" stroke="#19796E" stroke-width="2"/><text x="750" y="227" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">FINAL TEXT</text><text x="751" y="296" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">What is better for readers?</text><path d="M750 481 L1017 481" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round" fill="none"/></svg>