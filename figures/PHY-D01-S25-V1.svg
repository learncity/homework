<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Levels diagram">
<title>Levels diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Discrete energy levels in an atom</text>
<line x1="270" y1="420" x2="720" y2="420" stroke="#203A5E" stroke-width="4"/>
<text x="210" y="428" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172B4D" text-anchor="middle">E1 = 0 eV</text>
<line x1="270" y1="295" x2="720" y2="295" stroke="#203A5E" stroke-width="4"/>
<text x="210" y="303" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172B4D" text-anchor="middle">E2 = 3 eV</text>
<line x1="270" y1="170" x2="720" y2="170" stroke="#203A5E" stroke-width="4"/>
<text x="210" y="178" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172B4D" text-anchor="middle">E3 = 6 eV</text>
<line x1="560" y1="182" x2="560" y2="406" stroke="#B64030" stroke-width="4" marker-end="url(#r)"/>
<text x="610" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172B4D" text-anchor="middle">Photon emitted</text>
<text x="480" y="518" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#172B4D" text-anchor="middle">Arrow indicates a downward electronic transition.</text>
</svg>