<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="t d"><title id="t">Seed germination at different salinities</title><desc id="d">Twenty seeds were tested per treatment; outcomes are illustrative. Data: 0 g/L 18 germinated seeds, 2 g/L 15 germinated seeds, 4 g/L 9 germinated seeds, 6 g/L 3 germinated seeds.</desc>
<rect width="920" height="610" fill="#FAFCFF"/>
<text x="40" y="62" font-size="30" font-family="Arial" font-weight="bold" fill="#172B4D">Seed germination at different salinities</text>
<text x="40" y="95" font-size="17" font-family="Arial" fill="#43536A">Twenty seeds were tested per treatment; outcomes are illustrative.</text>
<line x1="70" y1="455" x2="860" y2="455" stroke="#596D87" stroke-width="3"/>
<rect x="95" y="160.0" width="106" height="295.0" rx="5" fill="#276B9B"/>
<text x="148" y="152.0" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">18</text>
<text x="148" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">0 g/L</text>
<rect x="295" y="209.2" width="106" height="245.8" rx="5" fill="#276B9B"/>
<text x="348" y="201.2" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">15</text>
<text x="348" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">2 g/L</text>
<rect x="495" y="307.5" width="106" height="147.5" rx="5" fill="#276B9B"/>
<text x="548" y="299.5" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">9</text>
<text x="548" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">4 g/L</text>
<rect x="695" y="405.8" width="106" height="49.2" rx="5" fill="#276B9B"/>
<text x="748" y="397.8" text-anchor="middle" font-size="24" font-weight="bold" font-family="Arial" fill="#172B4D">3</text>
<text x="748" y="492" text-anchor="middle" font-size="17" font-family="Arial" fill="#172B4D">6 g/L</text>
<text x="40" y="553" font-size="17" font-family="Arial" fill="#172B4D">Unit: germinated seeds. Values are observations, not proof of cause.</text></svg>