<svg xmlns="http://www.w3.org/2000/svg" width="960" height="570" viewBox="0 0 960 570" role="img" aria-labelledby="ttl desc">
<title id="ttl">Genetic cross observed phenotypes</title>
<desc id="desc">Genetic cross observed phenotypes. Purple 72, White 24, Intermediate 0, Unscored 4. An observed ratio is compatible with a model but cannot by itself establish the parents’ genotypes.</desc>
