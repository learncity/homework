<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><title>CHEM-R06-D05: Electrolysis of molten lead(II) bromide</title><desc>Visible diagram labels: Electrolysis of molten lead(II) bromide; Electrodes and observed products are identified; Molten PbBr₂; Anode (+); Cathode (−); Br₂ formed; Pb deposited; ← Br⁻; Pb²⁺ →. These labels are not a verified scientific description; teacher review is required.</desc><rect width="920" height="520" fill="#ffffff" /><rect width="920" height="86" fill="#17324d" /><text x="34" y="39" font-size="25" font-family="Arial" font-weight="700" fill="#ffffff">Electrolysis of molten lead(II) bromide</text><text x="34" y="69" font-size="16" font-family="Arial" fill="#e3eff7">Electrodes and observed products are identified</text><rect x="150" y="175" width="620" height="275" rx="8" fill="#ecf9ff" stroke="#475569" stroke-width="2" /><text x="196" y="215" font-size="23" font-family="Arial" fill="#17324d">Molten PbBr₂</text><line x1="286" y1="155" x2="286" y2="360" stroke="#475569" stroke-width="9" /><line x1="626" y1="155" x2="626" y2="360" stroke="#475569" stroke-width="9" /><text x="210" y="140" font-size="22" font-family="Arial" fill="#17324d">Anode (+)</text><text x="570" y="140" font-size="22" font-family="Arial" fill="#17324d">Cathode (−)</text><text x="225" y="394" font-size="21" font-family="Arial" fill="#17324d">Br₂ formed</text><text x="572" y="394" font-size="21" font-family="Arial" fill="#17324d">Pb deposited</text><text x="382" y="320" font-size="22" font-family="Arial" fill="#17324d">← Br⁻</text><text x="385" y="360" font-size="22" font-family="Arial" fill="#17324d">Pb²⁺ →</text></svg>