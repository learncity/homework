<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Internal structure of Earth</title><desc id="desc">Schematic nested rings representing crust (A outer solid rocky skin), mantle (B rocky layer), outer core (C mainly liquid metal) and inner core (D mainly solid metal). Not to scale.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Internal structure of Earth</text><text x="65" y="122" font-family="Arial" font-size="20" font-weight="600" fill="#1f2937" text-anchor="start">Schematic; not drawn to thickness scale</text><circle cx="288" cy="315" r="155" fill="#e8e1cc" stroke="#80593f" stroke-width="2"/><circle cx="288" cy="315" r="115" fill="#ef9f5b" stroke="#80593f" stroke-width="2"/><circle cx="288" cy="315" r="73" fill="#edc168" stroke="#80593f" stroke-width="2"/><circle cx="288" cy="315" r="35" fill="#f8eac2" stroke="#80593f" stroke-width="2"/><rect x="530" y="146" width="340" height="61" rx="10" fill="#f1f5f9" stroke="#c7d6e3"/><text x="550" y="171" font-family="Arial" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">A  Crust</text><text x="550" y="194" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">outer solid skin</text><rect x="530" y="227" width="340" height="61" rx="10" fill="#f1f5f9" stroke="#c7d6e3"/><text x="550" y="252" font-family="Arial" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">B  Mantle</text><text x="550" y="275" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">rocky layer</text><rect x="530" y="308" width="340" height="61" rx="10" fill="#f1f5f9" stroke="#c7d6e3"/><text x="550" y="333" font-family="Arial" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">C  Outer core</text><text x="550" y="356" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">mainly liquid metal</text><rect x="530" y="389" width="340" height="61" rx="10" fill="#f1f5f9" stroke="#c7d6e3"/><text x="550" y="414" font-family="Arial" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">D  Inner core</text><text x="550" y="437" font-family="Arial" font-size="15" font-weight="400" fill="#1f2937" text-anchor="start">mainly solid metal</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>