<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">GIS clinic site comparison</title><desc id="svgDesc">A table of candidate clinic sites. A: road 200 m, not in flood zone, 1200 people served; B: road 90 m, in flood zone, 2100 served; C: road 1700 m, not in flood zone, 500 served; D: road 400 m, not in flood zone, 900 served.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">GIS clinic site comparison</text><text x="60" y="114" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Candidate sites (hypothetical)</text><rect x="65" y="145" width="187" height="55" rx="0" fill="#1f4974" stroke="#1f4974"/><text x="158" y="180" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Site</text><rect x="252" y="145" width="187" height="55" rx="0" fill="#1f4974" stroke="#1f4974"/><text x="345" y="180" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Road distance (m)</text><rect x="439" y="145" width="187" height="55" rx="0" fill="#1f4974" stroke="#1f4974"/><text x="532" y="180" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Flood zone</text><rect x="626" y="145" width="187" height="55" rx="0" fill="#1f4974" stroke="#1f4974"/><text x="719" y="180" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">People served</text><rect x="65" y="201" width="187" height="50" rx="0" fill="#e9f2f9" stroke="#bed3e7"/><text x="158" y="232" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="middle">A</text><rect x="252" y="201" width="187" height="50" rx="0" fill="#e9f2f9" stroke="#bed3e7"/><text x="