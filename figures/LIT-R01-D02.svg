<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Interpretation pathway for The Missing Receipt"><rect width="1200" height="490" rx="18" fill="#123A4A"/><text x="44" y="58" font-family="DejaVu Sans,sans-serif" font-weight="700" font-size="32" fill="white">The Missing Receipt — evidence pathway</text><rect x="42" y="106" width="272" height="285" rx="14" fill="#ffffff"/><rect x="42" y="106" width="272" height="14" rx="7" fill="#F5B544"/><text x="58" y="154" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#18314C">TEXTUAL SETTING</text><text x="58" y="196" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">The trader counted the</text><text x="58" y="221" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">change twice and slipped</text><text x="58" y="246" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">an extra note into</text><text x="58" y="271" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">Timi’s hand.</text><path d="M316 254 h16" stroke="#F5B544" stroke-width="5"/><rect x="334" y="106" width="272" height="285" rx="14" fill="#ffffff"/><rect x="334" y="106" width="272" height="14" rx="7" fill="#75D5C8"/><text x="350" y="154" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#18314C">CONFLICT OR CHOICE</text><text x="350" y="196" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">returns the extra money</text><text x="350" y="221" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">despite his friends’</text><text x="350" y="246" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">advice</text><path d="M608 254 h16" stroke="#75D5C8" stroke-width="5"/><rect x="626" y="106" width="272" height="285" rx="14" fill="#ffffff"/><rect x="626" y="106" width="272" height="14" rx="7" fill="#FBCB87"/><text x="642" y="154" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#18314C">PIVOT</text><text x="642" y="196" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">Timi turns back toward</text><text x="642" y="221" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">the market</text><path d="M900 254 h16" stroke="#FBCB87" stroke-width="5"/><rect x="918" y="106" width="272" height="285" rx="14" fill="#ffffff"/><rect x="918" y="106" width="272" height="14" rx="7" fill="#D4B5FF"/><text x="934" y="154" font-family="DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#18314C">SUPPORTED READING</text><text x="934" y="196" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">honesty may require</text><text x="934" y="221" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">resisting convenient</text><text x="934" y="246" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#19304B">pressure</text><text x="44" y="451" font-family="DejaVu Sans,sans-serif" font-size="18" fill="#DFEAF5">Original unseen extract • read the source before drawing conclusions</text></svg>