<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 720 450" width="720" height="450"><title id="title">Food chain — energy-flow arrows</title><desc id="desc">The sequence shown is grass to grasshopper to frog to hawk, with arrows indicating energy transfer.</desc><defs><marker id="arrow" markerWidth="7" markerHeight="7" refX="6" refY="3" orient="auto"><path d="M0 0 L6 3 L0 6" fill="none" stroke="#24475B" stroke-width="1.4"/></marker></defs><rect width="720" height="450" fill="#FCFEFF"/><rect x="18" y="12" width="684" height="425" rx="16" fill="#FFFFFF" stroke="#C2D6DF" stroke-width="2"/><text x="360" y="46" text-anchor="middle" font-family="Arial,sans-serif" font-size="23" font-weight="bold" fill="#17475A">Food chain — energy-flow arrows</text><rect x="38" y="175" width="150" height="75" rx="9" fill="#A8D984" stroke="#1D4D4F" stroke-width="2"/>
<text x="113" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#163C40">GRASS</text>
<line x1="193" y1="212" x2="206" y2="212" stroke="#24475B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="211" y="175" width="150" height="75" rx="9" fill="#E4F2A9" stroke="#1D4D4F" stroke-width="2"/>
<text x="286" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="14" fill="#163C40">GRASSHOPPER</text>
<line x1="366" y1="212" x2="379" y2="212" stroke="#24475B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="384" y="175" width="150" height="75" rx="9" fill="#97D6C2" stroke="#1D4D4F" stroke-width="2"/>
<text x="459" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#163C40">FROG</text>
<line x1="539" y1="212" x2="552" y2="212" stroke="#24475B" stroke-width="3" marker-end="url(#arrow)"/>
<rect x="557" y="175" width="150" height="75" rx="9" fill="#B7C9E9" stroke="#1D4D4F" stroke-width="2"/>
<text x="632" y="219" text-anchor="middle" font-family="Arial,sans-serif" font-weight="bold" font-size="17" fill="#163C40">HAWK</text>
<text x="356" y="285" text-anchor="middle" font-family="Arial,sans-serif" font-weight="normal" font-size="18" fill="#163C40">Arrows show transfer of chemical energy through feeding</text><text x="360" y="422" text-anchor="middle" font-family="Arial,sans-serif" font-size="13" fill="#57717C">Schematic for Biology assessment — not to scale</text></svg>