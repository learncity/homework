<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Heating diagram">
<title>Heating diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Heating curve at constant heater power</text>
<line x1="135" y1="450" x2="830" y2="450" stroke="#203A5E" stroke-width="4" marker-end="url(#ar)"/>
<line x1="135" y1="450" x2="135" y2="145" stroke="#203A5E" stroke-width="4" marker-end="url(#ar)"/>
<text x="482.5" y="514" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172B4D" text-anchor="middle">Heating time (min)</text>
<text transform="translate(56 300) rotate(-90)" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" text-anchor="middle" fill="#172B4D">Temperature (°C)</text>
<line x1="308.75" y1="443" x2="308.75" y2="457" stroke="#203A5E" stroke-width="2"/>
<line x1="128" y1="373.75" x2="142" y2="373.75" stroke="#203A5E" stroke-width="2"/>
<line x1="482.5" y1="443" x2="482.5" y2="457" stroke="#203A5E" stroke-width="2"/>
<line x1="128" y1="297.5" x2="142" y2="297.5" stroke="#203A5E" stroke-width="2"/>
<line x1="656.25" y1="443" x2="656.25" y2="457" stroke="#203A5E" stroke-width="2"/>
<line x1="128" y1="221.25" x2="142" y2="221.25" stroke="#203A5E" stroke-width="2"/>
<line x1="830.0" y1="443" x2="830.0" y2="457" stroke="#203A5E" stroke-width="2"/>
<line x1="128" y1="145.0" x2="142" y2="145.0" stroke="#203A5E" stroke-width="2"/>
<polyline points="135,430 315,300 610,300 815,155" fill="none" stroke="#B64030" stroke-width="4"/>
<text x="135" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172B4D" text-anchor="middle">0</text>
<text x="315" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172B4D" text-anchor="middle">4</text>
<text x="610" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172B4D" text-anchor="middle">10</text>
<text x="815" y="486" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172B4D" text-anchor="middle">14</text>
<text x="110" y="306" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#172B4D" text-anchor="middle">80</text>
<text x="480" y="285" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172B4D" text-anchor="middle">Melting plateau</text>
<text x="480" y="120" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#172B4D" text-anchor="middle">Heater power = 150 W; mass = 0.9 kg</text>
</svg>