<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">River longitudinal profile</title><desc id="svgDesc">A schematic river profile with Source at 0 km and 1000 m, Bridge at 10 km and 650 m, Plain at 30 km and 300 m, and Estuary at 50 km and 0 m.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">River longitudinal profile</text><text x="55" y="113" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">Distance downstream (km) / elevation (m)</text><line x1="80" y1="400" x2="790" y2="400" stroke="#111827" stroke-width="2"/><polyline points="100,150.0 230,230.5 490,311.0 750,380.0" stroke="#2563eb" stroke-width="6" fill="none"/><circle cx="100" cy="150.0" r="7" fill="#1e40af"/><text x="100" y="131.0" font-family="Arial" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Source (0 km, 1000 m)</text><circle cx="230" cy="230.5" r="7" fill="#1e40af"/><text x="230" y="211.5" font-family="Arial" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Bridge (10 km, 650 m)</text><circle cx="490" cy="311.0" r="7" fill="#1e40af"/><text x="490" y="292.0" font-family="Arial" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Plain (30 km, 300 m)</text><circle cx="750" cy="380.0" r="7" fill="#1e40af"/><text x="750" y="361.0" font-family="Arial" font-size="15" font-weight="700" fill="#1e293b" text-anchor="middle">Estuary (50 km, 0 m)</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>