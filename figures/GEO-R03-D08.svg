<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Volcanic landforms and hazard pathways</title><desc id="desc">Simplified active volcano cross-section, A crater at summit, B main vent, C magma reservoir, D ash cloud and E valley path for possible rainfall-triggered lahar. Schematic and not to scale.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Volcanic landforms and hazard pathways</text><rect x="65" y="424" width="820" height="24" rx="0" fill="#cbb99c" stroke="#ad9676"/><path d="M185 424 L420 165 L510 165 L748 424 Z" fill="#b39a86" stroke="#7c5a46" stroke-width="4"/><path d="M420 165 L444 216 L473 216 L510 165" fill="#f8fbff" stroke="#7c5a46" stroke-width="3"/><path d="M447 226 L468 230 L477 364 L440 370 Z" fill="#ec8749" stroke="#a7472e" stroke-width="3"/><ellipse cx="459" cy="389" rx="100" ry="33" fill="#f0aa57" stroke="#b75637" stroke-width="3"/><ellipse cx="453" cy="124" rx="110" ry="46" fill="#c6cbd0" stroke="#a6b0b7" stroke-width="3"/><path d="M610 328 L732 413 L812 425" fill="none" stroke="#88523d" stroke-width="19"/><text x="525" y="188" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">A: Crater</text><text x="495" y="295" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">B: Vent</text><text x="343" y="396" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">C: Magma</text><text x="568" y="102" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">D: Ash cloud</text><text x="660" y="339" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="start">E: Lahar path</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>