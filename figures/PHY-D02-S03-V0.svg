<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Ticker physics examination diagram">
<title>Ticker physics examination diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Ticker-tape velocity comparison</text>
<text x="480" y="90" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#667085" text-anchor="middle">Equal time intervals Δt = 0.5 s between adjacent dots</text>
<rect x="105" y="170" width="730" height="75" fill="#F5F8FA" stroke="#203A5E" stroke-width="3"/>
<circle cx="180" cy="205" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<circle cx="220" cy="205" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<circle cx="260" cy="205" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<circle cx="300" cy="205" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<text x="760" y="157" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203A5E" text-anchor="middle">Earlier dots</text>
<rect x="105" y="325" width="730" height="75" fill="#F5F8FA" stroke="#203A5E" stroke-width="3"/>
<circle cx="180" cy="360" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<circle cx="340" cy="360" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<circle cx="500" cy="360" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<circle cx="660" cy="360" r="7" fill="#B64030" stroke="#203A5E" stroke-width="3"/>
<text x="760" y="312" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#203A5E" text-anchor="middle">Later dots</text>
<text x="480" y="480" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">Speeds from spacing: 2 m/s (early), 8 m/s (late)</text>
<text x="480" y="518" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#203A5E" text-anchor="middle">Interval between speed measurements = 3 s</text>
</svg>