<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><title>CHEM-R08-D07: Copper electroplating apparatus</title><desc>Visible diagram labels: Copper electroplating apparatus; Copper anode (+); Metal cathode (−); CuSO₄(aq); Cu²⁺ ions migrate →; Cu dissolves at anode; deposits on object at cathode.. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="820" height="440" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" rx="5" /><text x="410" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#183153" font-weight="bold" text-anchor="middle">Copper electroplating apparatus</text><line x1="36" y1="56" x2="784" y2="56" stroke="#DA9700" stroke-width="4" /><rect x="150" y="150" width="515" height="205" fill="#DFF1FE" stroke="#4282A7" stroke-width="2" rx="5" /><rect x="238" y="116" width="44" height="173" fill="#B87845" stroke="#93603B" stroke-width="2" rx="5" /><rect x="520" y="116" width="44" height="173" fill="#839AAA" stroke="#506D83" stroke-width="2" rx="5" /><text x="260" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Copper anode (+)</text><text x="544" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Metal cathode (−)</text><text x="390" y="380" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#183153" font-weight="normal" text-anchor="middle">CuSO₄(aq)</text><text x="393" y="249" font-family="Arial,DejaVu Sans,sans-serif" font-size="23" fill="#0C67A8" font-weight="bold" text-anchor="middle">Cu²⁺ ions migrate →</text><text x="393" y="410" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#183153" font-weight="normal" text-anchor="middle">Cu dissolves at anode; deposits on object at cathode.</text></svg>