<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 500" width="800" height="500"><title id="title">Reaction-time model by trial</title><desc id="desc">Reaction-time model by trial. First: 280, Second: 240, Third: 220, Fourth: 235. Repeated trials show variation; learning and fatigue may affect performance.</desc><rect x="0" y="0" width="800" height="500" rx="18" fill="#ffffff"/><rect x="0" y="0" width="800" height="92" rx="18" fill="#18243b"/><text x="35" y="49" fill="#ffffff" font-size="25" font-family="Arial, sans-serif" font-weight="bold">Reaction-time model by trial</text><text x="35" y="79" fill="#d4deeb" font-size="14" font-family="Arial, sans-serif">Illustrative teaching dataset — not observational research</text><text x="32" y="152" fill="#202d40" font-size="19" font-family="Arial, sans-serif">First</text><rect x="215" y="128" width="430" height="38" rx="6" fill="#e2a42d"/><text x="665" y="155" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">280</text><text x="32" y="227" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Second</text><rect x="215" y="203" width="369" height="38" rx="6" fill="#e2a42d"/><text x="604" y="230" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">240</text><text x="32" y="302" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Third</text><rect x="215" y="278" width="338" height="38" rx="6" fill="#e2a42d"/><text x="573" y="305" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">220</text><text x="32" y="377" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Fourth</text><rect x="215" y="353" width="361" height="38" rx="6" fill="#e2a42d"/><text x="596" y="380" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">235</text><text x="32" y="460" fill="#1e293b" font-size="15" font-family="Arial, sans-serif">Measure: Reaction time (ms)</text><text x="32" y="482" fill="#64748b" font-size="12" font-family="Arial, sans-serif">Read the values printed beside the bars; units are given in the measure label.</text></svg>