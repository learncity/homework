<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Topographic profile A–E</title><desc id="svgDesc">A schematic land-height profile with site elevations A 50 m, B 120 m, C 200 m at the central summit, D 120 m and E 50 m.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Topographic profile A–E</text><text x="55" y="120" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">Profile: labelled sites</text><line x1="70" y1="405" x2="800" y2="405" stroke="#111827" stroke-width="2"/><polyline points="110,347 260,277 410,197 560,277 710,347" fill="none" stroke="#308b73" stroke-width="6" stroke-linejoin="round"/><circle cx="110" cy="347" r="7" fill="#134e4a"/><text x="110" y="329" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">A: 50 m</text><circle cx="260" cy="277" r="7" fill="#134e4a"/><text x="260" y="259" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">B: 120 m</text><circle cx="410" cy="197" r="7" fill="#134e4a"/><text x="410" y="179" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">C: 200 m</text><circle cx="560" cy="277" r="7" fill="#134e4a"/><text x="560" y="259" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">D: 120 m</text><circle cx="710" cy="347" r="7" fill="#134e4a"/><text x="710" y="329" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="middle">E: 50 m</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>