<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Coastal landform schematic</title><desc id="svgDesc">Simplified coastal landform sketch showing A cliff, B wave-cut notch, C wave-cut platform, D sandy beach and E spit. Not a single measured cross-section. Schematic, not to scale.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Coastal landform schematic</text><rect x="52" y="120" width="315" height="270" rx="0" fill="#ead9bf" stroke="#9b8363"/><rect x="371" y="300" width="421" height="90" rx="0" fill="#b9def3" stroke="#6aa9cf"/><path d="M367 280 Q425 300 510 315 L790 315" stroke="#277ba7" stroke-width="4" fill="none"/><rect x="360" y="273" width="85" height="27" rx="0" fill="#8f7155" stroke="#76543b"/><text x="118" y="168" font-family="Arial" font-size="24" font-weight="700" fill="#1e293b" text-anchor="start">A: Cliff</text><text x="290" y="260" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">B: Notch</text><text x="455" y="348" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">C: Platform</text><rect x="550" y="285" width="155" height="25" rx="10" fill="#e4c67f" stroke="#bda55d"/><text x="578" y="276" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">D: Beach</text><path d="M705 310 Q770 285 790 320" stroke="#d9b561" stroke-width="13" fill="none"/><text x="704" y="235" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">E: Spit</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>