<svg xmlns="http://www.w3.org/2000/svg" width="900" height="520" viewBox="0 0 900 520"><title>CHEM-R03-D10: Two saturated structural isomers of C₄H₁₀</title><desc>Visible diagram labels: Two saturated structural isomers of C₄H₁₀; Structure A; Structure B; C; Butane (straight chain); 2-methylpropane (branched); Both have molecular formula C₄H₁₀; Schematic — not necessarily to scale. These labels are not a verified scientific description; teacher review is required.</desc><rect width="900" height="520" rx="18" fill="#f8fbfd" /><rect width="900" height="84" rx="18" fill="#143047" /><text x="35" y="54" fill="#FFFFFF" font-size="29" font-weight="bold" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif">Two saturated structural isomers of C₄H₁₀</text><text x="250" y="133" fill="#12243B" font-size="23" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">Structure A</text><text x="650" y="133" fill="#12243B" font-size="23" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">Structure B</text><line x1="102" y1="260" x2="214" y2="260" stroke="#263A52" stroke-width="3" /><line x1="214" y1="260" x2="326" y2="260" stroke="#263A52" stroke-width="3" /><line x1="326" y1="260" x2="435" y2="260" stroke="#263A52" stroke-width="3" /><text x="102" y="250" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="214" y="250" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="326" y="250" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="435" y="250" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><line x1="640" y1="260" x2="640" y2="182" stroke="#263A52" stroke-width="3" /><line x1="640" y1="260" x2="545" y2="331" stroke="#263A52" stroke-width="3" /><line x1="640" y1="260" x2="745" y2="331" stroke="#263A52" stroke-width="3" /><text x="640" y="260" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="640" y="164" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="531" y="341" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="759" y="341" fill="#12243B" font-size="25" font-weight="bold" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">C</text><text x="260" y="380" fill="#12243B" font-size="18" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">Butane (straight chain)</text><text x="648" y="380" fill="#12243B" font-size="18" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">2-methylpropane (branched)</text><text x="450" y="440" fill="#12243B" font-size="19" font-weight="normal" text-anchor="middle" font-family="DejaVu Sans,Arial,sans-serif">Both have molecular formula C₄H₁₀</text><text x="30" y="497" fill="#63788B" font-size="15" font-weight="normal" text-anchor="start" font-family="DejaVu Sans,Arial,sans-serif">Schematic — not necessarily to scale</text></svg>