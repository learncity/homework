<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 500" width="800" height="500"><title id="title">Indicator invertebrates in stream samples</title><desc id="desc">Indicator invertebrates in stream samples. Upstream: 28, Near drain: 6, Midstream: 13, Downstream: 20. Taxon counts alone cannot prove the cause of altered water quality.</desc><rect x="0" y="0" width="800" height="500" rx="18" fill="#ffffff"/><rect x="0" y="0" width="800" height="92" rx="18" fill="#18243b"/><text x="35" y="49" fill="#ffffff" font-size="25" font-family="Arial, sans-serif" font-weight="bold">Indicator invertebrates in stream samples</text><text x="35" y="79" fill="#d4deeb" font-size="14" font-family="Arial, sans-serif">Illustrative teaching dataset — not observational research</text><text x="32" y="152" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Upstream</text><rect x="215" y="128" width="430" height="38" rx="6" fill="#e2a42d"/><text x="665" y="155" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">28</text><text x="32" y="227" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Near drain</text><rect x="215" y="203" width="92" height="38" rx="6" fill="#e2a42d"/><text x="327" y="230" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">6</text><text x="32" y="302" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Midstream</text><rect x="215" y="278" width="200" height="38" rx="6" fill="#e2a42d"/><text x="435" y="305" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">13</text><text x="32" y="377" fill="#202d40" font-size="19" font-family="Arial, sans-serif">Downstream</text><rect x="215" y="353" width="307" height="38" rx="6" fill="#e2a42d"/><text x="542" y="380" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">20</text><text x="32" y="460" fill="#1e293b" font-size="15" font-family="Arial, sans-serif">Measure: Sensitive taxa counted</text><text x="32" y="482" fill="#64748b" font-size="12" font-family="Arial, sans-serif">Read the values printed beside the bars; units are given in the measure label.</text></svg>