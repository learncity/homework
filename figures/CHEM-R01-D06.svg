<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"><title>CHEM-R01-D06: F. Gas syringe at constant temperature</title><desc>Visible diagram labels: F. Gas syringe at constant temperature; 100 cm³, 100 kPa; 50 cm³, P₂ = ?; Fixed amount of gas; same temperature before and after compression. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="760" height="430" fill="#ffffff" /><style>text{font-family:Arial, sans-serif;fill:#15263d} .label{font-size:19px} .small{font-size:16px} .head{font-size:25px;font-weight:bold} .line{stroke:#1f3852;stroke-width:4;fill:none;stroke-linecap:round} .thin{stroke:#1f3852;stroke-width:2;fill:none} .liq{fill:#c8e7f2;stroke:#1f3852;stroke-width:2} .warm{fill:#f5d9c2;stroke:#1f3852;stroke-width:2} .neutral{fill:#e5e7eb;stroke:#1f3852;stroke-width:2} .point{fill:#e35d54} .ink{fill:#405ad6}</style><text x="35" y="40" class="head">F. Gas syringe at constant temperature</text><rect x="135" y="100" width="480" height="110" class="warm" /><rect x="455" y="90" width="25" height="130" class="warm" /><line x1="477" y1="151" x2="635" y2="151" class="line" /><text x="180" y="160" class="head">100 cm³, 100 kPa</text><rect x="135" y="260" width="480" height="110" class="liq" /><rect x="345" y="250" width="25" height="130" class="warm" /><line x1="368" y1="310" x2="635" y2="310" class="line" /><text x="175" y="318" class="head">50 cm³, P₂ = ?</text><text x="30" y="415" class="label">Fixed amount of gas; same temperature before and after compression</text></svg>