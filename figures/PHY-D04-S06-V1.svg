<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="crane power diagram">
<title>crane power diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Crane Power — Physics illustration</text>
<text x="480" y="90" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#667085" text-anchor="middle">Measurements and labels are authoritative; sketches are schematic unless scaled</text>
<line x1="280" y1="150" x2="620" y2="150" stroke="#203A5E" stroke-width="9"/>
<line x1="520" y1="150" x2="520" y2="265" stroke="#203A5E" stroke-width="5"/>
<circle cx="520" cy="170" r="32" fill="#E5EEF8" stroke="#203A5E" stroke-width="3"/>
<line x1="520" y1="205" x2="520" y2="380" stroke="#B64030" stroke-width="4"/>
<rect x="455" y="372" width="130" height="74" fill="#D8E6F3" stroke="#203A5E" stroke-width="3"/>
<text x="520" y="415" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">15 kg</text>
<line x1="660" y1="445" x2="660" y2="285" stroke="#B64030" stroke-width="3" marker-end="url(#r)"/>
<text x="730" y="360" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">8 m</text>
<text x="490" y="502" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="normal" fill="#203A5E" text-anchor="middle">Lift duration: 12 s; g=10 m/s²</text>
</svg>