<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Quiet Microphone"><rect width="1200" height="490" rx="18" fill="#3A2A42"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Quiet Microphone  |  DRAMA</text><rect x="34" y="104" width="754" height="308" rx="13" fill="#FFFFFF"/><text x="54" y="143" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#19576B" font-weight="700">SPEAKING TURNS</text><text x="55" y="178" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">MODERATOR</text><text x="276" y="178" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">Every candidate gets one minute.</text><text x="55" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">BOLA</text><text x="276" y="231" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">The microphone is not working on</text><text x="276" y="250" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">this side.</text><text x="55" y="284" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">TARI</text><text x="276" y="284" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">Let Bola use the centre</text><text x="276" y="303" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">microphone.</text><text x="55" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#0B7285" font-weight="700">MODERATOR</text><text x="276" y="337" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">That will add a minute to the</text><text x="276" y="356" font-family="DejaVu Sans,sans-serif" font-size="17" fill="#1D2D43">debate.</text><rect x="805" y="104" width="361" height="308" rx="13" fill="#E9F0FB"/><text x="826" y="143" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#19576B" font-weight="700">STAGE NOTATION</text><text x="825" y="181" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">TARI [stepping away from the</text><text x="825" y="211" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">stand]: Let Bola use the</text><text x="825" y="241" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#1D2D43">centre microphone.</text><text x="40" y="454" font-family="DejaVu Sans,sans-serif" font-size="19" fill="#F4F6FB">Consider how speech and visible movement work together. No answer is supplied.</text></svg>