<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title desc"><title id="title">Stomatal opening by time</title><desc id="desc">Out of twenty counted leaf stomata, open counts: morning light 15, midday heat 5, evening 9, night 2. Each is a different observation period. </desc><rect x="0" y="0" width="880" height="540" rx="0" fill="#F7FAFC" stroke="none"/><rect x="0" y="0" width="880" height="88" rx="0" fill="#1F2A44" stroke="none"/><text x="34" y="55" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="white">Stomatal opening by time</text><text x="35" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">BIOLOGY • EVIDENCE PANEL D34</text><rect x="80" y="261.0" width="105" height="180.0" rx="4" fill="#F2A900" stroke="none"/><text x="132" y="247.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">15 /20</text><text x="132" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#182941">Morning</text><rect x="274" y="381.0" width="105" height="60.0" rx="4" fill="#6A91B0" stroke="none"/><text x="326" y="367.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">5 /20</text><text x="326" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#182941">Midday</text><rect x="468" y="333.0" width="105" height="108.0" rx="4" fill="#6A91B0" stroke="none"/><text x="520" y="319.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="21" font-weight="bold" fill="#182941">9 /20</text><text x="520" y="471" text-anchor="middle" font-family="Arial, sans-serif" font-size="19" font-weight="normal" fill="#182941">Evening</text><rect x="662" y="417.0" width="105" height="24.0" rx="4" fill="#6A91B0" stroke="none"/><text x="