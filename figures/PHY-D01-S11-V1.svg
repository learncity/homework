<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Pendulum diagram">
<title>Pendulum diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Simple pendulum: small oscillations</text>
<line x1="275" y1="152" x2="683" y2="152" stroke="#203A5E" stroke-width="7"/>
<circle cx="480" cy="160" r="8" fill="#172B4D" stroke="#203A5E" stroke-width="3"/>
<line x1="480" y1="160" x2="480" y2="470" stroke="#203A5E" stroke-width="4" stroke-dasharray="9 7"/>
<line x1="480" y1="160" x2="330" y2="435" stroke="#B64030" stroke-width="5"/>
<circle cx="330" cy="435" r="28" fill="#F7BE7D" stroke="#203A5E" stroke-width="3"/>
<circle cx="480" cy="470" r="28" fill="#EDF4FC" stroke="#203A5E" stroke-width="2"/>
<text x="380" y="322" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#172B4D" text-anchor="middle">L = 4 m</text>
<text x="570" y="340" font-family="DejaVu Sans,Arial,sans-serif" font-size="20" font-weight="normal" fill="#172B4D" text-anchor="middle">Equilibrium</text>
<text x="480" y="525" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#172B4D" text-anchor="middle">g = 10 m/s²; small angular displacement</text>
</svg>