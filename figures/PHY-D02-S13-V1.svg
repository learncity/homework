<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Gas Data physics examination diagram">
<title>Gas Data physics examination diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Gas pressure–volume data at constant temperature</text>
<rect x="130" y="170" width="700" height="290" fill="#FAFCFE" stroke="#203A5E" stroke-width="3"/>
<line x1="140" y1="214" x2="810" y2="214" stroke="#203A5E" stroke-width="2"/>
<text x="270" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#203A5E" text-anchor="middle">50 cm³</text>
<text x="620" y="254" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#203A5E" text-anchor="middle">120 kPa</text>
<line x1="140" y1="299" x2="810" y2="299" stroke="#203A5E" stroke-width="2"/>
<text x="270" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#203A5E" text-anchor="middle">25 cm³</text>
<text x="620" y="339" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#203A5E" text-anchor="middle">240 kPa</text>
<line x1="140" y1="384" x2="810" y2="384" stroke="#203A5E" stroke-width="2"/>
<text x="270" y="424" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#203A5E" text-anchor="middle">16.667 cm³</text>
<text x="620" y="424" font-family="DejaVu Sans,Arial,sans-serif" font-size="23" font-weight="normal" fill="#203A5E" text-anchor="middle">360 kPa</text>
<text x="270" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#203A5E" text-anchor="middle">Volume</text>
<text x="620" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#203A5E" text-anchor="middle">Pressure</text>
<text x="480" y="526" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#203A5E" text-anchor="middle">Air column is compressed slowly at fixed temperature</text>
</svg>