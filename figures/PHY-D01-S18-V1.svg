<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="Refraction diagram">
<title>Refraction diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Refraction at an air–glass boundary</text>
<rect x="115" y="315" width="735" height="175" fill="#DCEEF9" stroke="#78B5D5" stroke-width="2"/>
<line x1="480" y1="110" x2="480" y2="490" stroke="#203A5E" stroke-width="4" stroke-dasharray="8 7"/>
<line x1="324.1" y1="225.0" x2="480" y2="315" stroke="#B64030" stroke-width="4" marker-end="url(#r)"/>
<line x1="480" y1="315" x2="572.5" y2="475.2146997001212" stroke="#1F8167" stroke-width="4" marker-end="url(#ar)"/>
<text x="375" y="240" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172B4D" text-anchor="middle">i = 60°</text>
<text x="555" y="390" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#172B4D" text-anchor="middle">r = 30°</text>
<text x="760" y="355" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#172B4D" text-anchor="middle">Glass</text>
<text x="755" y="280" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#172B4D" text-anchor="middle">Air</text>
</svg>