<svg xmlns="http://www.w3.org/2000/svg" width="1100" height="660" viewBox="0 0 1100 660" role="img" aria-label="Blank close-reading organiser for Rain at the Archive Window"><rect x="0" y="0" width="1100" height="660" rx="0" fill="#F4F7FB" stroke="#F4F7FB" stroke-width="2"/><rect x="25" y="25" width="1050" height="106" rx="18" fill="#20344F" stroke="#20344F" stroke-width="2"/><text x="52" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="30" font-weight="700" text-anchor="start" fill="#FFFFFF">Rain at the Archive Window</text><text x="1038" y="88" font-family="DejaVu Sans,Arial,sans-serif" font-size="19" font-weight="700" text-anchor="end" fill="#F6D5A8">FIG 01</text><rect x="38" y="578" width="1025" height="55" rx="10" fill="#E6EDF5" stroke="#E6EDF5" stroke-width="2"/><text x="62" y="612" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">What can be secured immediately? What still needs repair?</text><rect x="70" y="205" width="434" height="245" rx="18" fill="#FFFFFF" stroke="#735A9E" stroke-width="2"/><rect x="70" y="205" width="434" height="56" rx="18" fill="#735A9E" stroke="#735A9E" stroke-width="2"/><text x="92" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">OBSERVE</text><text x="93" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">Locate the initial hazard.</text><path d="M92 421 L481 421" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round" fill="none"/><rect x="598" y="205" width="434" height="245" rx="18" fill="#FFFFFF" stroke="#19796E" stroke-width="2"/><rect x="598" y="205" width="434" height="56" rx="18" fill="#19796E" stroke="#19796E" stroke-width="2"/><text x="620" y="242" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="700" text-anchor="start" fill="#FFFFFF">VERIFY</text><text x="621" y="311" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="500" text-anchor="start" fill="#5A697B">Distinguish action from outcome.</text><path d="M620 421 L1009 421" stroke="#D8E0E8" stroke-width="4" stroke-linecap="round" fill="none"/><path d="M509 327 L590 327" stroke="#B26E35" stroke-width="4" stroke-linecap="round" fill="none"/><text x="548" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" font-weight="700" text-anchor="middle" fill="#B26E35">CHECK</text></svg>