<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><title>CHEM-R06-D08: Aluminium production sequence</title><desc>Visible diagram labels: Aluminium production sequence; Schematic process stages; not to scale; Bauxite → purified alumina → dissolved in molten cryolite → aluminium; Bauxite; Al₂O₃; Molten cell; Al metal; Carbon anodes are consumed; CO₂ can be released.. These labels are not a verified scientific description; teacher review is required.</desc><rect width="920" height="520" fill="#ffffff" /><rect width="920" height="86" fill="#17324d" /><text x="34" y="39" font-size="25" font-family="Arial" font-weight="700" fill="#ffffff">Aluminium production sequence</text><text x="34" y="69" font-size="16" font-family="Arial" fill="#e3eff7">Schematic process stages; not to scale</text><text x="90" y="134" font-size="20" font-family="Arial" fill="#17324d">Bauxite → purified alumina → dissolved in molten cryolite → aluminium</text><rect x="100" y="200" width="130" height="110" rx="8" fill="#d9eced" stroke="#475569" stroke-width="2" /><text x="110" y="262" font-size="17" font-family="Arial" fill="#17324d">Bauxite</text><rect x="306" y="200" width="130" height="110" rx="8" fill="#d9eced" stroke="#475569" stroke-width="2" /><text x="316" y="262" font-size="17" font-family="Arial" fill="#17324d">Al₂O₃</text><rect x="512" y="200" width="130" height="110" rx="8" fill="#d9eced" stroke="#475569" stroke-width="2" /><text x="522" y="262" font-size="17" font-family="Arial" fill="#17324d">Molten cell</text><rect x="718" y="200" width="130" height="110" rx="8" fill="#d9eced" stroke="#475569" stroke-width="2" /><text x="728" y="262" font-size="17" font-family="Arial" fill="#17324d">Al metal</text><line x1="237" y1="255" x2="298" y2="255" stroke="#c8793e" stroke-width="5" /><polygon points="297,246 313,255 297,264" fill="#c8793e" /><line x1="443" y1="255" x2="504" y2="255" stroke="#c8793e" stroke-width="5" /><polygon points="503,246 519,255 503,264" fill="#c8793e" /><line x1="650" y1="255" x2="711" y2="255" stroke="#c8793e" stroke-width="5" /><polygon points="710,246 726,255 710,264" fill="#c8793e" /><text x="135" y="385" font-size="20" font-family="Arial" fill="#17324d">Carbon anodes are consumed; CO₂ can be released.</text></svg>