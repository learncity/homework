<text x="56" y="95" font-size="16" font-family="Arial" fill="#555">Illustrative classroom data — not official statistics · Units: ₦ million</text>
<line x1="120" y1="420.0" x2="810" y2="420.0" stroke="#E2E8F0"/>
<text x="106" y="425.0" font-family="Arial" text-anchor="end" font-size="15">0</text>
<line x1="120" y1="361.6" x2="810" y2="361.6" stroke="#E2E8F0"/>
<text x="106" y="366.6" font-family="Arial" text-anchor="end" font-size="15">16</text>
