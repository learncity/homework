<text x="106" y="249.8" font-family="Arial" text-anchor="end" font-size="15">48</text>
<line x1="120" y1="186.4" x2="810" y2="186.4" stroke="#E2E8F0"/>
<text x="106" y="191.4" font-family="Arial" text-anchor="end" font-size="15">64</text>
