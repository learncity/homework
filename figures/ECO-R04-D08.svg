<text x="106" y="133.0" font-family="Arial" text-anchor="end" font-size="15">80</text>
<line x1="120" y1="420" x2="810" y2="420" stroke="#334155" stroke-width="2"/>
<rect x="155.9" y="347.0" width="66.2" height="73.0" fill="#287D92" rx="3"/>
<text x="189.0" y="337.0" text-anchor="middle" font-size="16" font-family="Arial" font-weight="bold">20</text>
