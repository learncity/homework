<svg xmlns="http://www.w3.org/2000/svg" width="900" height="560" viewBox="0 0 900 560" role="img" aria-labelledby="title desc">
<title id="title">Modelled income impact at five investment levels</title>
<desc id="desc">Synthetic Economics class data: I1 20 ₦ million, I2 32 ₦ million, I3 48 ₦ million, I4 40 ₦ million, I5 64 ₦ million</desc>
<rect width="900" height="560" fill="#FFFFFF"/>
