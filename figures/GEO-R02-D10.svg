<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Karst limestone cross-section</title><desc id="svgDesc">Schematic karst cross-section labelled A doline or surface depression, B swallow hole, C underground cave, D stalactite hanging from roof, E stalagmite rising from floor.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Karst limestone cross-section</text><rect x="50" y="205" width="750" height="203" rx="0" fill="#d4c8a6" stroke="#967f5e"/><path d="M50 205 L235 205 Q300 280 355 205 L800 205" stroke="#67553c" stroke-width="5" fill="none"/><ellipse cx="535" cy="332" rx="190" ry="56" fill="#ecf6ff" stroke="#4b5563" stroke-width="3"/><path d="M450 280 L460 325 L470 280 M560 287 L555 317 L550 287" stroke="#c68d53" stroke-width="10" fill="none"/><path d="M500 375 L505 345 L510 375 M600 375 L597 345 L592 375" stroke="#b37647" stroke-width="10" fill="none"/><text x="225" y="150" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">A: Doline</text><text x="290" y="226" font-family="Arial" font-size="17" font-weight="700" fill="#1e293b" text-anchor="start">B: Swallow hole</text><text x="620" y="340" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">C: Cave</text><text x="410" y="255" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">D: Stalactite</text><text x="520" y="432" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">E: Stalagmite</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>