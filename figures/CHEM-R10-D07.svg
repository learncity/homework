<svg xmlns="http://www.w3.org/2000/svg" width="900" height="550" viewBox="0 0 900 550" role="img" aria-label="Ammonia equilibrium"><title>CHEM-R10-D07: Ammonia equilibrium</title><desc>Visible diagram labels: Ammonia equilibrium; Hypothetical measured yields at identical temperature; Equilibrium NH₃ yield (%); 35; Lower pressure; 60; Higher pressure. These labels are not a verified scientific description; teacher review is required.</desc><rect width="900" height="550" fill="#F8FBFF" /><rect x="30" y="28" width="840" height="490" rx="23" fill="white" stroke="#CBD5E1" stroke-width="2" /><text x="60" y="82" font-family="DejaVu Sans,Arial" font-size="30" font-weight="700" fill="#152D48">Ammonia equilibrium</text><text x="60" y="115" font-family="DejaVu Sans,Arial" font-size="17" fill="#52647B">Hypothetical measured yields at identical temperature</text><text x="60" y="152" font-family="DejaVu Sans,Arial" font-size="16" fill="#26425C">Equilibrium NH₃ yield (%)</text><line x1="95" y1="447" x2="807" y2="447" stroke="#475569" stroke-width="2" /><rect x="220.0" y="320.0" width="150.0" height="125.0" rx="4" fill="#1D4ED8" /><text x="295.0" y="306.0" text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="700">35</text><text x="295.0" y="476" text-anchor="middle" font-family="DejaVu Sans" font-size="17">Lower pressure</text><rect x="530.0" y="230.7" width="150.0" height="214.3" rx="4" fill="#0D9488" /><text x="605.0" y="216.7" text-anchor="middle" font-family="DejaVu Sans" font-size="22" font-weight="700">60</text><text x="605.0" y="476" text-anchor="middle" font-family="DejaVu Sans" font-size="17">Higher pressure</text></svg>