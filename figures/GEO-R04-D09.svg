<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Karst groundwater conceptual sketch</title><desc id="desc">Conceptual limestone drainage: D waste dump upslope, A swallow hole, B underground conduit, C discharge spring and E a nearby well; flow pathways are illustrative, not verified.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Karst groundwater conceptual sketch</text><text x="50" y="120" font-family="Arial" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Hillside</text><path d="M80 270 L270 160 L500 310 L860 300" fill="none" stroke="#6d8e57" stroke-width="24"/><rect x="120" y="137" width="130" height="47" rx="9" fill="#f6dba7" stroke="#b88943"/><text x="185" y="167" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">D: Dump</text><path d="M260 185 Q310 270 360 292 Q455 400 585 395 T745 382" fill="none" stroke="#259ec7" stroke-width="12" stroke-dasharray="16 10"/><text x="310" y="214" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">A: Swallow hole</text><text x="454" y="378" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">B: Conduit</text><text x="760" y="352" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">C: Spring</text><text x="677" y="260" font-family="Arial" font-size="17" font-weight="700" fill="#1f2937" text-anchor="start">E: Well</text><circle cx="760" cy="380" r="11" fill="#2677ab"/><circle cx="677" cy="306" r="10" fill="#2677ab"/><text x="485" y="467" font-family="Arial" font-size="19" font-weight="600" fill="#1f2937" text-anchor="middle">Schematic drainage only • flow paths require tracing</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>