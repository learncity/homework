<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Two-stage map resizing exercise</title><desc id="desc">Five fictional maps are resized uniformly from 1:50000. A enlarged factor 2 means 1:25000, B enlarged factor 2.5 means 1:20000, C reduced factor 0.5 means 1:100000, D enlarged factor 5 means 1:10000, E unchanged factor 1 means 1:50000.</desc><rect width="960" height="540" fill="#F4F8FC"/><rect x="12" y="12" width="936" height="516" rx="18" fill="#FFFFFF" stroke="#CBD9E5"/><rect x="12" y="12" width="936" height="81" rx="18" fill="#1F2A44"/><rect x="12" y="70" width="936" height="23" fill="#1F2A44"/><text x="480" y="63" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Two-stage map resizing exercise</text><rect x="110" y="130.0" width="195" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="207.5" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Map</text><rect x="305" y="130.0" width="250" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="430.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Linear factor</text><rect x="555" y="130.0" width="295" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="702.5" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">New denominator</text><rect x="110" y="185.0" width="195" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="207.5" y="218.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">A</text><rect x="305" y="185.0" width="250" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="430.0" y="218.5" text-anchor="middle" font-family="Aria