<text x="482" y="182" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#203A5E" text-anchor="middle">P thermal = 500 MW</text>
<text x="480" y="432" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" font-weight="normal" fill="#203A5E" text-anchor="middle">P electrical = 200 MW</text>
<text x="480" y="491" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#203A5E" text-anchor="middle">Core: control rods + moderator + coolant + shielding</text>
