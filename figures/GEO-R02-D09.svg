<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Trade quantities by partner</title><desc id="svgDesc">Grouped horizontal bars. Exports to Q 60, R 25, S 15 units; imports from Q 40, R 30, S 10 units. Values are synthetic and not a statement about actual countries.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Trade quantities by partner</text><text x="58" y="116" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Trade quantity (illustrative units)</text><rect x="555" y="92" width="18" height="18" rx="0" fill="#2c6a98" stroke="#2c6a98"/><text x="580" y="108" font-family="Arial" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Exports</text><rect x="685" y="92" width="18" height="18" rx="0" fill="#dc9139" stroke="#dc9139"/><text x="709" y="108" font-family="Arial" font-size="17" font-weight="400" fill="#1e293b" text-anchor="start">Imports</text><text x="70" y="194" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">Partner Q</text><rect x="200" y="176" width="360" height="25" rx="0" fill="#2c6a98" stroke="#2c6a98"/><text x="573" y="196" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">60</text><rect x="200" y="208" width="240" height="25" rx="0" fill="#dc9139" stroke="#dc9139"/><text x="453" y="229" font-family="Arial" font-size="18" font-weight="700" fill="#1e293b" text-anchor="start">40</text><text x="70" y="281" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">Partner R</text><rect x="200" y="263" width="150" height="25" rx="0" fill="#2c6a98" stroke="#2c6a98"/><text x="363" y="283" font-family="Aria