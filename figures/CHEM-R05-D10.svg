<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520"><title>CHEM-R05-D10: Energy pathways | two supply systems</title><desc>Visible diagram labels: Energy pathways | two supply systems; System A: PV panel; Sunlight → electricity; → battery → lamp; System B: diesel; Fuel → engine; → generator → lamp; Compare operational emissions, storage and energy source.. These labels are not a verified scientific description; teacher review is required.</desc><rect width="860" height="520" fill="#ffffff" /><rect x="16" y="16" width="828" height="488" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="430" y="53" text-anchor="middle" font-size="25" font-family="DejaVu Sans" font-weight="700" fill="#0f172a">Energy pathways | two supply systems</text><rect x="65" y="120" width="335" height="260" fill="#dbeafe" stroke="#475569" stroke-width="2" /><rect x="455" y="120" width="335" height="260" fill="#fef3c7" stroke="#475569" stroke-width="2" /><text x="106" y="175" font-size="22" fill="#0f172a" font-family="DejaVu Sans">System A: PV panel</text><text x="95" y="230" font-size="18" fill="#0f172a" font-family="DejaVu Sans">Sunlight → electricity</text><text x="95" y="280" font-size="18" fill="#0f172a" font-family="DejaVu Sans">→ battery → lamp</text><text x="497" y="175" font-size="22" fill="#0f172a" font-family="DejaVu Sans">System B: diesel</text><text x="484" y="230" font-size="18" fill="#0f172a" font-family="DejaVu Sans">Fuel → engine</text><text x="484" y="280" font-size="18" fill="#0f172a" font-family="DejaVu Sans">→ generator → lamp</text><text x="105" y="435" font-size="17" fill="#0f172a" font-family="DejaVu Sans">Compare operational emissions, storage and energy source.</text></svg>