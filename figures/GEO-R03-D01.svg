<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Longitudes and local solar times</title><desc id="desc">At one instant, fictional sites W 60 degrees west 08:00, X 45 degrees west 09:00, G Greenwich 0 degrees 12:00, Y 30 degrees east 14:00 and Z 90 degrees east 18:00. 15 degrees equals one hour.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Longitudes and local solar times</text><text x="80" y="117" font-family="Arial" font-size="20" font-weight="700" fill="#1f2937" text-anchor="start">Same instant • local solar time (illustrative)</text><rect x="58" y="155" width="150" height="205" rx="12" fill="#e5f2fa" stroke="#aac8dc"/><text x="133" y="199" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Site W</text><text x="133" y="247" font-family="Arial" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">60°W</text><text x="133" y="298" font-family="Arial" font-size="27" font-weight="700" fill="#205885" text-anchor="middle">08:00</text><rect x="232" y="155" width="150" height="205" rx="12" fill="#e5f2fa" stroke="#aac8dc"/><text x="307" y="199" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Site X</text><text x="307" y="247" font-family="Arial" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">45°W</text><text x="307" y="298" font-family="Arial" font-size="27" font-weight="700" fill="#205885" text-anchor="middle">09:00</text><rect x="406" y="155" width="150" height="205" rx="12" fill="#e5f2fa" stroke="#aac8dc"/><text x="481" y="199" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Site G</text><text x="481" y="247" font-family="Arial" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">0°</text><text x="481" y="298" font-family="Arial" font-size="27" font-weight="700" fill="#205885" text-anchor="middle">12:00</text><rect x="580" y="155" width="150" height="205" rx="12" fill="#e5f2fa" stroke="#aac8dc"/><text x="655" y="199" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Site Y</text><text x="655" y="247" font-family="Arial" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">30°E</text><text x="655" y="298" font-family="Arial" font-size="27" font-weight="700" fill="#205885" text-anchor="middle">14:00</text><rect x="754" y="155" width="150" height="205" rx="12" fill="#e5f2fa" stroke="#aac8dc"/><text x="829" y="199" font-family="Arial" font-size="22" font-weight="700" fill="#1f2937" text-anchor="middle">Site Z</text><text x="829" y="247" font-family="Arial" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">90°E</text><text x="829" y="298" font-family="Arial" font-size="27" font-weight="700" fill="#205885" text-anchor="middle">18:00</text><text x="485" y="419" font-family="Arial" font-size="21" font-weight="600" fill="#1f2937" text-anchor="middle">15° longitude ≈ 1 hour of solar time</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>