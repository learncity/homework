<svg xmlns="http://www.w3.org/2000/svg" width="686" height="420" viewBox="0 0 686 420" role="img"><title>Route of revision</title><desc>Notice what new information changes the route.</desc><rect x="0" y="0" width="686" height="420" rx="16" fill="#F6F4EF"/><rect x="20" y="18" width="646" height="63" rx="14" fill="#15334B"/><text x="43" y="58" fill="#FFFFFF" font-size="24" font-weight="700" font-family="Arial,sans-serif">Route of revision</text><rect x="58" y="119" width="170" height="62" rx="14" fill="#4D6686"/><text x="84" y="160" fill="white" font-size="20" font-weight="700" font-family="Arial,sans-serif">Old route</text><rect x="451" y="263" width="170" height="62" rx="14" fill="#267E83"/><text x="469" y="302" fill="white" font-size="20" font-weight="700" font-family="Arial,sans-serif">New route</text><path d="M228 150 L409 150" stroke="#B67636" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M409 150 L409 293" stroke="#B67636" stroke-width="7" fill="none" stroke-linecap="round"/><path d="M409 293 L451 293" stroke="#B67636" stroke-width="7" fill="none" stroke-linecap="round"/><rect x="265" y="205" width="207" height="43" rx="8" fill="#E7D7C6"/><text x="287" y="234" fill="#15334B" font-size="16" font-weight="700" font-family="Arial,sans-serif">New evidence?</text><rect x="21" y="365" width="644" height="40" rx="9" fill="#E8F0F1"/><text x="35" y="391" fill="#15334B" font-size="13" font-weight="400" font-family="Arial,sans-serif">Notice what new information changes the route.</text></svg>