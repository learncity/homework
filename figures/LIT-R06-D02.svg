<svg xmlns="http://www.w3.org/2000/svg" width="686" height="420" viewBox="0 0 686 420" role="img"><title>Caption cross-check</title><desc>Set the public claim beside its documentary evidence.</desc><rect x="0" y="0" width="686" height="420" rx="16" fill="#F6F4EF"/><rect x="20" y="18" width="646" height="63" rx="14" fill="#15334B"/><text x="43" y="58" fill="#FFFFFF" font-size="24" font-weight="700" font-family="Arial,sans-serif">Caption cross-check</text><rect x="44" y="132" width="240" height="150" rx="14" fill="#4D6686"/><text x="61" y="171" fill="white" font-size="19" font-weight="700" font-family="Arial,sans-serif">DISPLAY CLAIM</text><text x="62" y="216" fill="white" font-size="16" font-weight="400" font-family="Arial,sans-serif">What is asserted?</text><rect x="401" y="132" width="240" height="150" rx="14" fill="#267E83"/><text x="420" y="171" fill="white" font-size="19" font-weight="700" font-family="Arial,sans-serif">SOURCE RECORD</text><text x="422" y="216" fill="white" font-size="16" font-weight="400" font-family="Arial,sans-serif">What is shown?</text><circle cx="344" cy="211" r="42" fill="#B67636"/><text x="313" y="217" fill="white" font-size="19" font-weight="700" font-family="Arial,sans-serif">TEST</text><text x="70" y="327" fill="#4D5A68" font-size="16" font-weight="400" font-family="Arial,sans-serif">Identify the gap; do not assume the caption is correct.</text><rect x="21" y="365" width="644" height="40" rx="9" fill="#E8F0F1"/><text x="35" y="391" fill="#15334B" font-size="13" font-weight="400" font-family="Arial,sans-serif">Set the public claim beside its documentary evidence.</text></svg>