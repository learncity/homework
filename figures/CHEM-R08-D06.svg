<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><title>CHEM-R08-D06: Conditions for corrosion</title><desc>Visible diagram labels: Conditions for corrosion; Jar A; Dry air; desiccant; Iron nail; No rust; Jar B; Deoxygenated; water + oil layer; Jar C; Moist air; water + oxygen; Rust. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="820" height="440" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" rx="5" /><text x="410" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#183153" font-weight="bold" text-anchor="middle">Conditions for corrosion</text><line x1="36" y1="56" x2="784" y2="56" stroke="#DA9700" stroke-width="4" /><rect x="72" y="112" width="210" height="222" fill="#F0F8FF" stroke="#4580A4" stroke-width="2" rx="5" /><text x="177" y="99" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#183153" font-weight="bold" text-anchor="middle">Jar A</text><text x="177" y="175" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Dry air</text><text x="177" y="205" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#183153" font-weight="normal" text-anchor="middle">desiccant</text><text x="177" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Iron nail</text><text x="177" y="315" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#216A55" font-weight="bold" text-anchor="middle">No rust</text><rect x="330" y="112" width="210" height="222" fill="#F0F8FF" stroke="#4580A4" stroke-width="2" rx="5" /><text x="435" y="99" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#183153" font-weight="bold" text-anchor="middle">Jar B</text><text x="435" y="175" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Deoxygenated</text><text x="435" y="205" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#183153" font-weight="normal" text-anchor="middle">water + oil layer</text><text x="435" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Iron nail</text><text x="435" y="315" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#216A55" font-weight="bold" text-anchor="middle">No rust</text><rect x="588" y="112" width="210" height="222" fill="#F0F8FF" stroke="#4580A4" stroke-width="2" rx="5" /><text x="693" y="99" font-family="Arial,DejaVu Sans,sans-serif" font-size="20" fill="#183153" font-weight="bold" text-anchor="middle">Jar C</text><text x="693" y="175" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Moist air</text><text x="693" y="205" font-family="Arial,DejaVu Sans,sans-serif" font-size="16" fill="#183153" font-weight="normal" text-anchor="middle">water + oxygen</text><text x="693" y="270" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="middle">Iron nail</text><text x="693" y="315" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#A34836" font-weight="bold" text-anchor="middle">Rust</text></svg>