<svg xmlns="http://www.w3.org/2000/svg" width="640" height="360" viewBox="0 0 640 360"><title>CHEM-R07-D07: Potassium nitrate solubility curve</title><desc>Visible diagram labels: Potassium nitrate solubility curve; Solubility, g per 100 g water; Temperature (°C); 32 g; 20°C; 64 g; 40°C; 110 g; 60°C; KNO₃. These labels are not a verified scientific description; teacher review is required.</desc><rect width="640" height="360" fill="#FFFFFF" /><text x="320" y="37" font-family="DejaVu Sans,Arial,sans-serif" font-size="22" fill="#172B46" font-weight="bold" text-anchor="middle">Potassium nitrate solubility curve</text><line x1="40" y1="55" x2="600" y2="55" stroke="#F2A900" stroke-width="3" /><line x1="120" y1="280" x2="565" y2="280" stroke="#334155" stroke-width="3" /><line x1="120" y1="280" x2="120" y2="85" stroke="#334155" stroke-width="3" /><text x="140" y="75" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172B46" font-weight="normal" text-anchor="start">Solubility, g per 100 g water</text><text x="350" y="332" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172B46" font-weight="normal" text-anchor="middle">Temperature (°C)</text><polyline points="200,245 320,205 450,120" fill="none" stroke="#1976A9" stroke-width="5" /><circle cx="200" cy="245" r="6" fill="#E5A000" stroke="#A56600" stroke-width="2" /><text x="200" y="229" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172B46" font-weight="normal" text-anchor="middle">32 g</text><text x="200" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172B46" font-weight="normal" text-anchor="middle">20°C</text><circle cx="320" cy="205" r="6" fill="#E5A000" stroke="#A56600" stroke-width="2" /><text x="320" y="189" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172B46" font-weight="normal" text-anchor="middle">64 g</text><text x="320" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172B46" font-weight="normal" text-anchor="middle">40°C</text><circle cx="450" cy="120" r="6" fill="#E5A000" stroke="#A56600" stroke-width="2" /><text x="450" y="104" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" fill="#172B46" font-weight="normal" text-anchor="middle">110 g</text><text x="450" y="304" font-family="DejaVu Sans,Arial,sans-serif" font-size="16" fill="#172B46" font-weight="normal" text-anchor="middle">60°C</text><text x="525" y="185" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" fill="#172B46" font-weight="bold" text-anchor="start">KNO₃</text></svg>