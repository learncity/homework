<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Model pastoral water-point balance</title><desc id="desc">Five imaginary water points in thousands of litres per day: A supply 65 demand 50; B supply 45 demand 55; C supply 70 demand 60; D supply 35 demand 50; E supply 80 demand 75. Largest deficit is D 15, B deficit 10.</desc><rect width="960" height="540" fill="#F4F8FC"/><rect x="12" y="12" width="936" height="516" rx="18" fill="#FFFFFF" stroke="#CBD9E5"/><rect x="12" y="12" width="936" height="81" rx="18" fill="#1F2A44"/><rect x="12" y="70" width="936" height="23" fill="#1F2A44"/><text x="480" y="63" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Model pastoral water-point balance</text><rect x="95" y="130.0" width="150" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="170.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Point</text><rect x="245" y="130.0" width="310" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="400.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Supply (thousand L)</text><rect x="555" y="130.0" width="310" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="710.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Demand (thousand L)</text><rect x="95" y="185.0" width="150" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="170.0" y="218.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">A</text><rect x="245" y="185.0" width="310" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="400.0" y="218.5" text-anchor="middle" font-family="Arial,Deja