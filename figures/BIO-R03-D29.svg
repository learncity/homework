<title id="title">Nephron filtrate pathway</title>
<desc id="desc">Simplified path: renal corpuscle → proximal tubule → loop of Henle → distal tubule → collecting duct. Glomerulus and capsule Filtration; Proximal tubule Bulk reabsorption; Loop of Henle Osmotic gradient; Distal tubule Solute adjustment; Collecting duct Regulated water reabsorption</desc>
