<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><title>CHEM-R08-D02: Boyle law measurements</title><desc>Visible diagram labels: Boyle law measurements; Fixed amount of ideal gas at constant temperature; Pressure (kPa); 100; 150; 200; 300; Volume (dm³); 12; 8; 6; 4; All measurements belong to the same sealed gas sample.. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="820" height="440" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" rx="5" /><text x="410" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#183153" font-weight="bold" text-anchor="middle">Boyle law measurements</text><line x1="36" y1="56" x2="784" y2="56" stroke="#DA9700" stroke-width="4" /><text x="75" y="88" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" fill="#183153" font-weight="normal" text-anchor="start">Fixed amount of ideal gas at constant temperature</text><rect x="50" y="125" width="218" height="57" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="159.0" y="162.62" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">Pressure (kPa)</text><rect x="268.0" y="125" width="125.5" height="57" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="330.75" y="162.62" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">100</text><rect x="393.5" y="125" width="125.5" height="57" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="456.25" y="162.62" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">150</text><rect x="519.0" y="125" width="125.5" height="57" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="581.75" y="162.62" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anch