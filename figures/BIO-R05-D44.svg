<svg xmlns="http://www.w3.org/2000/svg" width="920" height="610" viewBox="0 0 920 610" role="img" aria-labelledby="t d"><title id="t">Mean seedling height by light treatment</title><desc id="d">Equal-aged seedlings observed after a fixed week under different light doses. Data: Dark 2 cm, Low 5 cm, Medium 9 cm, High 11 cm.</desc>
