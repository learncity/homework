<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">River observations downstream</title><desc id="desc">Illustrative headwater river discharge 10 cubic metres per second and 4 NTU; middle 18 and 11; lower 34 and 25. Differences are not proof of one cause.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">River observations downstream</text><rect x="130.0" y="125" width="210" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="235.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">River reach</text><rect x="340.0" y="125" width="245" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="462.5" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Discharge (m³/s)</text><rect x="585.0" y="125" width="245" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="707.5" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Turbidity (NTU)</text><rect x="130.0" y="192" width="210" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="235.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Headwater</text><rect x="340.0" y="192" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="462.5" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">10</text><rect x="585.0" y="192" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="707.5" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">4</text><rect x="130.0" y="259" width="210" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="235.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Middle</text><rect x="340.0" y="259" width="245" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="462.5" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">18</text><rect x="585.0" y="259" width="245" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="707.5" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">11</text><rect x="130.0" y="326" width="210" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="235.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">Lower</text><rect x="340.0" y="326" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="462.5" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">34</text><rect x="585.0" y="326" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="707.5" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">25</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>