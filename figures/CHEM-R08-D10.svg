<svg xmlns="http://www.w3.org/2000/svg" width="820" height="440" viewBox="0 0 820 440"><title>CHEM-R08-D10: Water hardness survey</title><desc>Visible diagram labels: Water hardness survey; Equal 100 cm³ aliquots; same soap concentration and endpoint; Water sample; A; B; C; D; Soap used (cm³); 2; 5; 10; 16; More soap to form persistent lather indicates greater hardness.. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="820" height="440" fill="#FFFFFF" stroke="#FFFFFF" stroke-width="2" rx="5" /><text x="410" y="39" font-family="Arial,DejaVu Sans,sans-serif" font-size="25" fill="#183153" font-weight="bold" text-anchor="middle">Water hardness survey</text><line x1="36" y1="56" x2="784" y2="56" stroke="#DA9700" stroke-width="4" /><text x="74" y="90" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#183153" font-weight="normal" text-anchor="start">Equal 100 cm³ aliquots; same soap concentration and endpoint</text><rect x="50" y="124" width="218" height="54" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="159.0" y="159.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">Water sample</text><rect x="268.0" y="124" width="125.5" height="54" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="330.75" y="159.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">A</text><rect x="393.5" y="124" width="125.5" height="54" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="456.25" y="159.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">B</text><rect x="519.0" y="124" width="125.5" height="54" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="581.75" y="159.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">C</text><rect x="644.5" y="124" width="125.5" height="54" fill="#DDECF7" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="707.25" y="159.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="bold" text-anchor="middle">D</text><rect x="50" y="178" width="218" height="54" fill="#F4F8FC" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="159.0" y="213.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" fill="#173858" font-weight="normal" text-anchor="middle">Soap used (cm³)</text><rect x="268.0" y="178" width="125.5" height="54" fill="#F4F8FC" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="330.75" y="213.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="normal" text-anchor="middle">2</text><rect x="393.5" y="178" width="125.5" height="54" fill="#F4F8FC" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="456.25" y="213.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="normal" text-anchor="middle">5</text><rect x="519.0" y="178" width="125.5" height="54" fill="#F4F8FC" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="581.75" y="213.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="normal" text-anchor="middle">10</text><rect x="644.5" y="178" width="125.5" height="54" fill="#F4F8FC" stroke="#8CA2B5" stroke-width="2" rx="5" /><text x="707.25" y="213.64" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#173858" font-weight="normal" text-anchor="middle">16</text><text x="74" y="302" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" fill="#26607F" font-weight="normal" text-anchor="start">More soap to form persistent lather indicates greater hardness.</text></svg>