<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Model monthly displacement markers on a hillside</title><desc id="desc">Illustrative monitored one-month slope-marker movements P 2 mm, Q 5 mm, R 9 mm, S 6 mm and T 3 mm. They are displacements, not an actual landslide forecast.</desc><rect width="960" height="540" fill="#F4F8FC"/><rect x="12" y="12" width="936" height="516" rx="18" fill="#FFFFFF" stroke="#CBD9E5"/><rect x="12" y="12" width="936" height="81" rx="18" fill="#1F2A44"/><rect x="12" y="70" width="936" height="23" fill="#1F2A44"/><text x="480" y="63" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Model monthly displacement markers on a hillside</text><line x1="76" y1="450" x2="905" y2="450" stroke="#344A60" stroke-width="2"/><rect x="105.0" y="397.27272727272725" width="65" height="52.72727272727273" rx="4" fill="#2D87AE" stroke="#2D87AE"/><text x="137.5" y="385.27272727272725" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#1d3553">2 mm</text><text x="137.5" y="484" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1d3553">P</text><rect x="265.0" y="318.1818181818182" width="65" height="131.8181818181818" rx="4" fill="#2D87AE" stroke="#2D87AE"/><text x="297.5" y="306.1818181818182" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#1d3553">5 mm</text><text x="297.5" y="484" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1d3553">Q</text><rect x="425.0" y="212.72727272727272" width="65" height="237.27272727272728" rx="4" fill="#2D87AE" stroke="#2D87AE"/><text x="457.5" y="200.72727272727272" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#1d3553">9 mm</text><text x="457.5" y="484" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1d3553">R</text><rect x="585.0" y="291.81818181818187" width="65" height="158.18181818181816" rx="4" fill="#2D87AE" stroke="#2D87AE"/><text x="617.5" y="279.81818181818187" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#1d3553">6 mm</text><text x="617.5" y="484" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1d3553">S</text><rect x="745.0" y="370.90909090909093" width="65" height="79.09090909090908" rx="4" fill="#2D87AE" stroke="#2D87AE"/><text x="777.5" y="358.90909090909093" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#1d3553">3 mm</text><text x="777.5" y="484" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="17" font-weight="700" fill="#1d3553">T</text><text x="480" y="516" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="14" font-weight="400" fill="#667C91">Illustrative classroom dataset · not observed or official data</text></svg>