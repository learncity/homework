<title id="t">Simplified rock cycle</title><desc id="d">Diagram with labelled process arrows: magma cools to igneous rock; weathering creates sediment; lithification forms sedimentary rock; heat and pressure form metamorphic rock; melting returns material to magma.</desc>
<rect x="0" y="0" width="820" height="520" rx="0" fill="#f8fbfd" stroke="none" opacity="1"/><rect x="0" y="0" width="820" height="68" rx="0" fill="#16324f" stroke="none" opacity="1"/><text x="28" y="43" font-family="Arial, sans-serif" font-size="25" fill="#fff" text-anchor="start" font-weight="bold">Simplified rock cycle</text><rect x="37" y="155" width="170" height="54" rx="12" fill="#e3f2ee" stroke="#007c91" opacity="1"/><text x="122" y="188" font-family="Arial, sans-serif" font-size="18" fill="#16324f" text-anchor="middle" font-weight="bold">Magma</text><rect x="279" y="108" width="170" height="54" rx="12" fill="#e3f2ee" stroke="#007c91" opacity="1"/><text x="364" y="141" font-family="Arial, sans-serif" font-size="18" fill="#16324f" text-anchor="middle" font-weight="bold">Igneous rock</text><rect x="525" y="155" width="170" height="54" rx="12" fill="#e3f2ee" stroke="#007c91" opacity="1"/><text x="610" y="188" font-family="Arial, sans-serif" font-size="18" fill="#16324f" text-anchor="middle" font-weight="bold">Sediment</text><rect x="530" y="323" width="170" height="54" rx="12" fill="#e3f2ee" stroke="#007c91" opacity="1"/><text x="615" y="356" font-family="Arial, sans-serif" font-size="18" fill="#16324f" text-anchor="middle" font-weight="bold">Sedimentary rock</text><rect x="215" y="348" width="170" height="54" rx="12" fill="#e3f2ee" stroke="#007c91" opacity="1"/><text x="300" y="381" font-family="Arial, sans-serif" font-size="18" fill="#16324f" text-anchor="middle" font-weight="bold">Metamorphic rock</text><line x1="207" y1="174" x2="268" y2="142" stroke="#007c91" stroke-width="3" /><polygon points="268,142 260.3,152.4 255.0,142.4" fill="#007c91" stroke="none" stroke-width="2"/><text x="224" y="120" font-family="Arial, sans-serif" font-size="15" fill="#16324f" text-anchor="start" font-weight="normal">Cooling</text><line x1="449" y1="142" x2="525" y2="174" stroke="#007c91" stroke-width="3" /><polygon points="525,174 512.0,174.7 516.4,164.2" fill="#007c91" stroke="none" stroke-width="2"/><text x="497" y="113" font-family="Arial, sans-serif" font-size="15" fill="#16324f" text-anchor="start" font-weight="normal">Weathering</text><line x1="608" y1="212" x2="608" y2="315" stroke="#007c91" stroke-width="3" /><polygon points="608,315 602.3,303.3 613.7,303.3" fill="#007c91" stroke="none" stroke-width="2"/><text x="627" y="266" font-family="Arial, sans-serif" font-size="15" fill="#16324f" text-anchor="start" font-weight="normal">Lithification</text><line x1="530" y1="365" x2="388" y2="373" stroke="#007c91" stroke-width="3" /><polygon points="388,373 399.4,366.7 400.0,378.0" fill="#007c91" stroke="none" stroke-width="2"/><text x="473" y="402" font-family="Arial, sans-serif" font-size="15" fill="#16324f" text-anchor="start" font-weight="normal">Heat + pressure</text><line x1="230" y1="345" x2="140" y2="216" stroke="#007c91" stroke-width="3" /><polygon points="140,216 151.3,222.4 142.1,228.8" fill="#007c91" stroke="none" stroke-width="2"/><text x="95" y="315" font-family="Arial, sans-serif" font-size="15" fill="#16324f" text-anchor="start" font-weight="normal">Melting</text>
