<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Five route lengths at a map scale of 1:25,000</title><desc id="desc">Hypothetical representative fraction 1 to 25,000, one centimetre on paper equals 0.25 kilometres on the ground. Routes P Q R S T measure 4 6 10 8 12 cm and represent 1 1.5 2.5 2 3 km.</desc><rect width="960" height="540" fill="#F4F8FC"/><rect x="12" y="12" width="936" height="516" rx="18" fill="#FFFFFF" stroke="#CBD9E5"/><rect x="12" y="12" width="936" height="81" rx="18" fill="#1F2A44"/><rect x="12" y="70" width="936" height="23" fill="#1F2A44"/><text x="480" y="63" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Five route lengths at a map scale of 1:25,000</text><rect x="105" y="130.0" width="220" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="215.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Route</text><rect x="325" y="130.0" width="250" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="450.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">On map</text><rect x="575" y="130.0" width="280" height="55.0" rx="4" fill="#284965" stroke="#B7CADE"/><text x="715.0" y="163.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">On ground</text><rect x="105" y="185.0" width="220" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="215.0" y="218.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">P</text><rect x="325" y="185.0" width="250" height="55.0" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="450.0" y="218.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size