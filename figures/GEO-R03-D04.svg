<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Farming rainfall and yield records</title><desc id="desc">Four hypothetical farms, plot A rainfall 780 mm and maize yield 2.4 tonnes per hectare; B 910 mm and 3.6; C 860 mm and 3.1; D 690 mm and 1.8. Association does not prove rainfall alone causes yields.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Farming rainfall and yield records</text><text x="68" y="114" font-family="Arial" font-size="17" font-weight="600" fill="#1f2937" text-anchor="start">Rainfall measured across growing season; yields are illustrative</text><rect x="82.5" y="125" width="245" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="205.0" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Farm plot</text><rect x="327.5" y="125" width="260" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="457.5" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Rainfall (mm)</text><rect x="587.5" y="125" width="290" height="67" rx="3" fill="#1F2A44" stroke="#1F2A44"/><text x="732.5" y="165.5" font-family="Arial" font-size="17" font-weight="700" fill="#fff" text-anchor="middle">Maize yield (t/ha)</text><rect x="82.5" y="192" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="205.0" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">A</text><rect x="327.5" y="192" width="260" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="457.5" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">780</text><rect x="587.5" y="192" width="290" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="732.5" y="232.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">2.4</text><rect x="82.5" y="259" width="245" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="205.0" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">B</text><rect x="327.5" y="259" width="260" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="457.5" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">910</text><rect x="587.5" y="259" width="290" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="732.5" y="299.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">3.6</text><rect x="82.5" y="326" width="245" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="205.0" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">C</text><rect x="327.5" y="326" width="260" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="457.5" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">860</text><rect x="587.5" y="326" width="290" height="67" rx="3" fill="#eff5fc" stroke="#c2d1df"/><text x="732.5" y="366.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">3.1</text><rect x="82.5" y="393" width="245" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="205.0" y="433.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">D</text><rect x="327.5" y="393" width="260" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="457.5" y="433.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">690</text><rect x="587.5" y="393" width="290" height="67" rx="3" fill="#fff" stroke="#c2d1df"/><text x="732.5" y="433.5" font-family="Arial" font-size="17" font-weight="500" fill="#24344a" text-anchor="middle">1.8</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>