<svg xmlns="http://www.w3.org/2000/svg" width="850" height="500" viewBox="0 0 850 500" role="img" aria-labelledby="svgTitle svgDesc"><title id="svgTitle">Earthquake focus and epicentre</title><desc id="svgDesc">A schematic earthquake cross-section. F is the underground focus at a stated depth of 30 km; E is the epicentre directly above F on the land surface; dashed line indicates a fault plane.</desc><rect width="850" height="500" fill="#ffffff"/><rect x="20" y="16" width="810" height="468" rx="16" fill="#f8fbff" stroke="#dce6f3" stroke-width="2"/><text x="48" y="66" font-size="27" font-weight="700" font-family="Arial" fill="#13294a">Earthquake focus and epicentre</text><rect x="55" y="170" width="735" height="240" rx="0" fill="#e1d4c5" stroke="#927d66"/><line x1="55" y1="170" x2="790" y2="170" stroke="#43352d" stroke-width="3"/><path d="M250 410 L395 220 L455 170" fill="none" stroke="#b45309" stroke-width="6" stroke-dasharray="10,7"/><circle cx="395" cy="300" r="12" fill="#e11d48"/><circle cx="395" cy="170" r="9" fill="#1e40af"/><text x="415" y="310" font-family="Arial" font-size="21" font-weight="700" fill="#1e293b" text-anchor="start">F: Focus, 30 km depth</text><text x="415" y="155" font-family="Arial" font-size="20" font-weight="700" fill="#1e293b" text-anchor="start">E: Epicentre</text><text x="72" y="216" font-family="Arial" font-size="18" font-weight="400" fill="#1e293b" text-anchor="start">Rock section</text><text x="67" y="134" font-family="Arial" font-size="19" font-weight="700" fill="#1e293b" text-anchor="start">Land surface</text><text x="290" y="450" font-family="Arial" font-size="18" font-weight="400" fill="#1e293b" text-anchor="start">Fault plane (dashed)</text><text x="48" y="463" font-family="Arial" font-size="13" fill="#475569">Synthetic classroom data • not a surveyed real-world location</text></svg>