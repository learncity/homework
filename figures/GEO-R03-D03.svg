<svg xmlns="http://www.w3.org/2000/svg" width="960" height="560" viewBox="0 0 960 560" role="img" aria-labelledby="title desc"><title id="title">Measured landform cross-section</title><desc id="desc">A 4 km cross-section with sites at horizontal distances A zero km 110 m, B 1 km 160 m, C 2 km 260 m, D 3 km 180 m, E 4 km 100 m. Schematic profile.</desc><rect width="960" height="560" fill="#ffffff"/><rect x="16" y="16" width="928" height="528" rx="18" fill="#f8fbff" stroke="#d5e1ee" stroke-width="2"/><text x="45" y="65" font-size="27" font-weight="700" font-family="Arial" fill="#1F2A44">Measured landform cross-section</text><text x="70" y="114" font-family="Arial" font-size="19" font-weight="600" fill="#1f2937" text-anchor="start">Horizontal distance A–E: 4 km; elevations in m</text><line x1="75" y1="458" x2="900" y2="458" stroke="#26374d" stroke-width="2"/><polyline fill="none" stroke="#2d9577" stroke-width="7" points="115,331.5 285,274.0 455,159.0 625,251.0 795,343.0"/><circle cx="115" cy="331.5" r="7" fill="#1e6a54"/><text x="115" y="307.5" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">A: 110 m</text><text x="115" y="483" font-family="Arial" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">0 km</text><circle cx="285" cy="274.0" r="7" fill="#1e6a54"/><text x="285" y="250.0" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">B: 160 m</text><text x="285" y="483" font-family="Arial" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">1 km</text><circle cx="455" cy="159.0" r="7" fill="#1e6a54"/><text x="455" y="135.0" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">C: 260 m</text><text x="455" y="483" font-family="Arial" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">2 km</text><circle cx="625" cy="251.0" r="7" fill="#1e6a54"/><text x="625" y="227.00000000000003" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">D: 180 m</text><text x="625" y="483" font-family="Arial" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">3 km</text><circle cx="795" cy="343.0" r="7" fill="#1e6a54"/><text x="795" y="319.0" font-family="Arial" font-size="18" font-weight="700" fill="#1f2937" text-anchor="middle">E: 100 m</text><text x="795" y="483" font-family="Arial" font-size="16" font-weight="400" fill="#1f2937" text-anchor="middle">4 km</text><text x="48" y="526" font-family="Arial" font-size="14" fill="#516174">Illustrative classroom scenario • not official geographic statistics</text></svg>