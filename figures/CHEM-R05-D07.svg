<svg xmlns="http://www.w3.org/2000/svg" width="860" height="520" viewBox="0 0 860 520"><title>CHEM-R05-D07: Molecular structures | two hydrocarbons</title><desc>Visible diagram labels: Molecular structures | two hydrocarbons; A: ethene (C₂H₄); B: ethane (C₂H₆); H₂C=CH₂; H₃C–CH₃; Double bond in A; Single bond in B; Compare bond saturation and chemical reactivity.. These labels are not a verified scientific description; teacher review is required.</desc><rect width="860" height="520" fill="#ffffff" /><rect x="16" y="16" width="828" height="488" rx="12" fill="#f8fafc" stroke="#94a3b8" stroke-width="2" /><text x="430" y="53" text-anchor="middle" font-size="25" font-family="DejaVu Sans" font-weight="700" fill="#0f172a">Molecular structures | two hydrocarbons</text><text x="120" y="150" font-size="21" fill="#0f172a" font-family="DejaVu Sans">A: ethene (C₂H₄)</text><text x="515" y="150" font-size="21" fill="#0f172a" font-family="DejaVu Sans">B: ethane (C₂H₆)</text><text x="235" y="290" font-size="36" fill="#0f172a" font-family="DejaVu Sans">H₂C=CH₂</text><text x="563" y="290" font-size="36" fill="#0f172a" font-family="DejaVu Sans">H₃C–CH₃</text><text x="118" y="390" font-size="19" fill="#0f172a" font-family="DejaVu Sans">Double bond in A</text><text x="520" y="390" font-size="19" fill="#0f172a" font-family="DejaVu Sans">Single bond in B</text><text x="185" y="465" font-size="18" fill="#0f172a" font-family="DejaVu Sans">Compare bond saturation and chemical reactivity.</text></svg>