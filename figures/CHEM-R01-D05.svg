<svg xmlns="http://www.w3.org/2000/svg" width="760" height="430" viewBox="0 0 760 430"><title>CHEM-R01-D05: E. Ionic bonding model: sodium chloride</title><desc>Visible diagram labels: E. Ionic bonding model: sodium chloride; Na⁺ (cation); Cl⁻ (anion); Electron transfer; Charge +1; Charge −1; Oppositely charged ions attract in an extended lattice. These labels are not a verified scientific description; teacher review is required.</desc><rect x="0" y="0" width="760" height="430" fill="#ffffff" /><style>text{font-family:Arial, sans-serif;fill:#15263d} .label{font-size:19px} .small{font-size:16px} .head{font-size:25px;font-weight:bold} .line{stroke:#1f3852;stroke-width:4;fill:none;stroke-linecap:round} .thin{stroke:#1f3852;stroke-width:2;fill:none} .liq{fill:#c8e7f2;stroke:#1f3852;stroke-width:2} .warm{fill:#f5d9c2;stroke:#1f3852;stroke-width:2} .neutral{fill:#e5e7eb;stroke:#1f3852;stroke-width:2} .point{fill:#e35d54} .ink{fill:#405ad6}</style><text x="35" y="40" class="head">E. Ionic bonding model: sodium chloride</text><rect x="90" y="145" width="225" height="150" class="warm" /><rect x="425" y="145" width="245" height="150" class="liq" /><text x="135" y="200" class="head">Na⁺ (cation)</text><text x="468" y="200" class="head">Cl⁻ (anion)</text><line x1="325" y1="218" x2="408" y2="218" class="line" /><text x="230" y="115" class="label">Electron transfer</text><text x="160" y="255" class="label">Charge +1</text><text x="492" y="255" class="label">Charge −1</text><text x="92" y="350" class="label">Oppositely charged ions attract in an extended lattice</text></svg>