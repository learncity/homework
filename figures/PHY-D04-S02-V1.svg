<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 560" width="960" height="560" role="img" aria-label="route map diagram">
<title>route map diagram</title>
<rect width="960" height="560" fill="#ffffff"/>
<defs><marker id="ar" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#203A5E"/></marker><marker id="r" markerWidth="9" markerHeight="7" refX="8" refY="3.5" orient="auto"><path d="M0,0 L9,3.5 L0,7" fill="#B64030"/></marker></defs>
<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Route Map — Physics illustration</text>
<text x="480" y="90" font-family="DejaVu Sans,Arial,sans-serif" font-size="18" font-weight="normal" fill="#667085" text-anchor="middle">Measurements and labels are authoritative; sketches are schematic unless scaled</text>
<line x1="240" y1="430" x2="700" y2="430" stroke="#203A5E" stroke-width="3"/>
<line x1="700" y1="430" x2="700" y2="165" stroke="#203A5E" stroke-width="3"/>
<line x1="240" y1="430" x2="700" y2="165" stroke="#B64030" stroke-width="4" stroke-dasharray="10 7" marker-end="url(#r)"/>
<text x="220" y="452" font-family="DejaVu Sans,Arial,sans-serif" font-size="25" font-weight="normal" fill="#203A5E" text-anchor="middle">A</text>
<text x="720" y="444" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#203A5E" text-anchor="middle">C</text>
<text x="724" y="153" font-family="DejaVu Sans,Arial,sans-serif" font-size="24" font-weight="normal" fill="#203A5E" text-anchor="middle">B</text>
<text x="470" y="468" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">5 m East</text>
<text x="800" y="305" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">12 m North</text>
<text x="430" y="215" font-family="DejaVu Sans,Arial,sans-serif" font-size="17" font-weight="normal" fill="#B64030" text-anchor="middle">Direct displacement</text>
