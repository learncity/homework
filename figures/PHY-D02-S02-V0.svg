<text x="480" y="52" font-family="DejaVu Sans,Arial,sans-serif" font-size="27" font-weight="bold" fill="#172B4D" text-anchor="middle">Timing a swinging pendulum</text>
<line x1="245" y1="153" x2="710" y2="153" stroke="#203A5E" stroke-width="6"/>
<line x1="480" y1="153" x2="480" y2="440" stroke="#95A7BD" stroke-width="2"/>
<line x1="480" y1="153" x2="380" y2="410" stroke="#B64030" stroke-width="5"/>
