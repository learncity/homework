<text x="750" y="278" font-family="DejaVu Sans,Arial,sans-serif" font-size="21" font-weight="normal" fill="#203A5E" text-anchor="middle">20 oscillations</text>
<text x="750" y="318" font-family="DejaVu Sans,Arial,sans-serif" font-size="28" font-weight="normal" fill="#B64030" text-anchor="middle">32 s</text>
