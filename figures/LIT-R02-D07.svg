<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="490" viewBox="0 0 1200 490" role="img" aria-label="Reading guide for The Blank Mural"><rect width="1200" height="490" rx="18" fill="#0F4252"/><text x="36" y="57" font-family="DejaVu Sans,sans-serif" font-size="32" fill="#F4F6FB" font-weight="700">The Blank Mural  |  PROSE</text><rect x="33" y="100" width="370" height="304" rx="13" fill="#FFFFFF"/><text x="52" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#145B72" font-weight="700">EARLY DETAIL</text><path d="M51 156 h334" stroke="#7CD4CB" stroke-width="3"/><text x="53" y="191" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">On Monday the pupils found</text><text x="53" y="220" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">a blank wall where the old</text><text x="53" y="249" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">mural had been painted</text><text x="53" y="278" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">over.</text><rect x="423" y="100" width="370" height="304" rx="13" fill="#FFFFFF"/><text x="442" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#145B72" font-weight="700">ANOTHER DETAIL</text><path d="M441 156 h334" stroke="#7CD4CB" stroke-width="3"/><text x="443" y="191" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">Each class wanted to draw</text><text x="443" y="220" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">its own victory on the new</text><text x="443" y="249" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">surface.</text><rect x="813" y="100" width="370" height="304" rx="13" fill="#FFFFFF"/><text x="832" y="142" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#145B72" font-weight="700">ENDING DETAIL</text><path d="M831 156 h334" stroke="#7CD4CB" stroke-width="3"/><text x="833" y="191" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">When the bell rang, nobody</text><text x="833" y="220" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">had yet painted, but every</text><text x="833" y="249" font-family="DejaVu Sans,sans-serif" font-size="21" fill="#1D2D43">class had a place.</text><text x="40" y="454" font-family="DejaVu Sans,sans-serif" font-size="20" fill="#F4F6FB">Compare the details. Which changes the direction of the narrative, and why?</text></svg>