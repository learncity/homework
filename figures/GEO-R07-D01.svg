<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 960 540" width="960" height="540"><title id="title">Fictional meridian solar-time exercise</title><desc id="desc">Town A is at 5 degrees east, B at 20 east, C at 35 east and D at 50 east. One degree of longitude corresponds to four minutes local solar time.</desc><rect width="960" height="540" fill="#F4F8FC"/><rect x="12" y="12" width="936" height="516" rx="18" fill="#FFFFFF" stroke="#CBD9E5"/><rect x="12" y="12" width="936" height="81" rx="18" fill="#1F2A44"/><rect x="12" y="70" width="936" height="23" fill="#1F2A44"/><text x="480" y="63" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="26" font-weight="700" fill="#FFFFFF">Fictional meridian solar-time exercise</text><rect x="80" y="130" width="170" height="57" rx="4" fill="#284965" stroke="#B7CADE"/><text x="165.0" y="164.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Town</text><rect x="250" y="130" width="240" height="57" rx="4" fill="#284965" stroke="#B7CADE"/><text x="370.0" y="164.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="700" fill="#FFFFFF">Longitude</text><rect x="490" y="130" width="390" height="57" rx="4" fill="#284965" stroke="#B7CADE"/><text x="685.0" y="164.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="15" font-weight="700" fill="#FFFFFF">Solar offset from A</text><rect x="80" y="187" width="170" height="57" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="165.0" y="221.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">A</text><rect x="250" y="187" width="240" height="57" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="370.0" y="221.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">5°E</text><rect x="490" y="187" width="390" height="57" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="685.0" y="221.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">0 h</text><rect x="80" y="244" width="170" height="57" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="165.0" y="278.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">B</text><rect x="250" y="244" width="240" height="57" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="370.0" y="278.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">20°E</text><rect x="490" y="244" width="390" height="57" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="685.0" y="278.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">+1 h</text><rect x="80" y="301" width="170" height="57" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="165.0" y="335.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">C</text><rect x="250" y="301" width="240" height="57" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="370.0" y="335.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">35°E</text><rect x="490" y="301" width="390" height="57" rx="4" fill="#E9F3FB" stroke="#B7CADE"/><text x="685.0" y="335.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">+2 h</text><rect x="80" y="358" width="170" height="57" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="165.0" y="392.5" text-anchor="middle" font-family="Arial,DejaVu Sans,sans-serif" font-size="18" font-weight="400" fill="#23425B">D</text><rect x="250" y="358" width="240" height="57" rx="4" fill="#FFFFFF" stroke="#B7CADE"/><text x="370.0" y="392.5" text-anchor="middle" font-family="Ar