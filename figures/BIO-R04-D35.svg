<svg xmlns="http://www.w3.org/2000/svg" width="880" height="540" viewBox="0 0 880 540" role="img" aria-labelledby="title desc"><title id="title">Simplified nephron filtrate route</title><desc id="desc">Blood enters glomerular capillary tuft, filtrate enters Bowmans capsule then proximal tubule, loop of Henle, distal tubule and collecting duct.</desc><rect x="0" y="0" width="880" height="540" rx="0" fill="#F7FAFC" stroke="none"/><rect x="0" y="0" width="880" height="88" rx="0" fill="#1F2A44" stroke="none"/><text x="34" y="55" text-anchor="start" font-family="Arial, sans-serif" font-size="27" font-weight="bold" fill="white">Simplified nephron filtrate route</text><text x="35" y="128" text-anchor="start" font-family="Arial, sans-serif" font-size="15" font-weight="bold" fill="#64748B">BIOLOGY • EVIDENCE PANEL D35</text><rect x="35.0" y="165" width="397.0" height="90" rx="10" fill="#E4EEF6" stroke="#C9D7E3"/><text x="49.0" y="192" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A46A00">01</text><text x="49.0" y="223" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182941">Glomerular filtration</text><text x="444.0" y="218.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#F2A900">→</text><rect x="458.0" y="165" width="397.0" height="90" rx="10" fill="#E4EEF6" stroke="#C9D7E3"/><text x="472.0" y="192" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A46A00">02</text><text x="472.0" y="223" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182941">Bowman’s capsule</text><text x="656.5" y="268" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F2A900">↓</text><rect x="35.0" y="270" width="397.0" height="90" rx="10" fill="#E4EEF6" stroke="#C9D7E3"/><text x="49.0" y="297" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A46A00">03</text><text x="49.0" y="328" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182941">Proximal tubule</text><text x="444.0" y="323.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#F2A900">→</text><rect x="458.0" y="270" width="397.0" height="90" rx="10" fill="#E4EEF6" stroke="#C9D7E3"/><text x="472.0" y="297" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A46A00">04</text><text x="472.0" y="328" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182941">Loop of Henle</text><text x="656.5" y="373" text-anchor="middle" font-family="Arial, sans-serif" font-size="22" font-weight="bold" fill="#F2A900">↓</text><rect x="35.0" y="375" width="397.0" height="90" rx="10" fill="#E4EEF6" stroke="#C9D7E3"/><text x="49.0" y="402" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A46A00">05</text><text x="49.0" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182941">Distal tubule</text><text x="444.0" y="428.0" text-anchor="middle" font-family="Arial, sans-serif" font-size="26" font-weight="bold" fill="#F2A900">→</text><rect x="458.0" y="375" width="397.0" height="90" rx="10" fill="#E4EEF6" stroke="#C9D7E3"/><text x="472.0" y="402" text-anchor="start" font-family="Arial, sans-serif" font-size="13" font-weight="bold" fill="#A46A00">06</text><text x="472.0" y="433" text-anchor="start" font-family="Arial, sans-serif" font-size="18" font-weight="bold" fill="#182941">Collecting duct</text><text x="35" y="505" text-anchor="start" font-family="Arial, sans-serif" font-size="16" font-weight="normal" fill="#64748B">Simplified educational model — not to anatomical scale.</text></svg>