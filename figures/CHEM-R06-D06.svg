<svg xmlns="http://www.w3.org/2000/svg" width="920" height="520" viewBox="0 0 920 520"><title>CHEM-R06-D06: Two alkanol structures</title><desc>Visible diagram labels: Two alkanol structures; Compare position of hydroxyl group and molecular formula; A: CH₃–CH₂–CH₂–CH₂OH; B: CH₃–CH(OH)–CH₂–CH₃; Butan-1-ol; Butan-2-ol; –OH on carbon 1; –OH on carbon 2; Both molecular formula: C₄H₁₀O. These labels are not a verified scientific description; teacher review is required.</desc><rect width="920" height="520" fill="#ffffff" /><rect width="920" height="86" fill="#17324d" /><text x="34" y="39" font-size="25" font-family="Arial" font-weight="700" fill="#ffffff">Two alkanol structures</text><text x="34" y="69" font-size="16" font-family="Arial" fill="#e3eff7">Compare position of hydroxyl group and molecular formula</text><rect x="90" y="125" width="335" height="290" rx="8" fill="#f8fbff" stroke="#475569" stroke-width="2" /><rect x="485" y="125" width="335" height="290" rx="8" fill="#f8fbff" stroke="#475569" stroke-width="2" /><text x="132" y="185" font-size="24" font-family="Arial" fill="#17324d">A: CH₃–CH₂–CH₂–CH₂OH</text><text x="525" y="185" font-size="21" font-family="Arial" fill="#17324d">B: CH₃–CH(OH)–CH₂–CH₃</text><text x="132" y="242" font-size="22" font-family="Arial" fill="#17324d">Butan-1-ol</text><text x="525" y="242" font-size="22" font-family="Arial" fill="#17324d">Butan-2-ol</text><text x="144" y="323" font-size="20" font-family="Arial" fill="#17324d">–OH on carbon 1</text><text x="525" y="323" font-size="20" font-family="Arial" fill="#17324d">–OH on carbon 2</text><text x="315" y="465" font-size="23" font-family="Arial" fill="#17324d">Both molecular formula: C₄H₁₀O</text></svg>