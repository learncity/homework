<svg xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc" viewBox="0 0 800 500" width="800" height="500"><title id="title">Amylase model at different pH</title><desc id="desc">Amylase model at different pH. 4: 6, 6: 16, 7: 20, 9: 4. Only the measured settings are supported; the global optimum needs finer sampling.</desc><rect x="0" y="0" width="800" height="500" rx="18" fill="#ffffff"/><rect x="0" y="0" width="800" height="92" rx="18" fill="#18243b"/><text x="35" y="49" fill="#ffffff" font-size="25" font-family="Arial, sans-serif" font-weight="bold">Amylase model at different pH</text><text x="35" y="79" fill="#d4deeb" font-size="14" font-family="Arial, sans-serif">Illustrative teaching dataset — not observational research</text><text x="32" y="152" fill="#202d40" font-size="19" font-family="Arial, sans-serif">4</text><rect x="215" y="128" width="129" height="38" rx="6" fill="#e2a42d"/><text x="364" y="155" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">6</text><text x="32" y="227" fill="#202d40" font-size="19" font-family="Arial, sans-serif">6</text><rect x="215" y="203" width="344" height="38" rx="6" fill="#e2a42d"/><text x="579" y="230" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">16</text><text x="32" y="302" fill="#202d40" font-size="19" font-family="Arial, sans-serif">7</text><rect x="215" y="278" width="430" height="38" rx="6" fill="#e2a42d"/><text x="665" y="305" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">20</text><text x="32" y="377" fill="#202d40" font-size="19" font-family="Arial, sans-serif">9</text><rect x="215" y="353" width="86" height="38" rx="6" fill="#e2a42d"/><text x="321" y="380" fill="#202d40" font-weight="bold" font-size="20" font-family="Arial, sans-serif">4</text><text x="32" y="460" fill="#1e293b" font-size="15" font-family="Arial, sans-serif">Measure: Activity (arbitrary units)</text><text x="32" y="482" fill="#64748b" font-size="12" font-family="Arial, sans-serif">Read the values printed beside the bars; units are given in the measure label.</text></svg>